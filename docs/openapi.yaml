      type: object
      required: [name, trigger, action, actionConfig]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        trigger: { $ref: '#/components/schemas/AutomationTrigger' }
        condition:
          type: [object, 'null']
          additionalProperties: { type: string }
        action: { $ref: '#/components/schemas/AutomationAction' }
        actionConfig:
          type: object
          additionalProperties: { type: string }
          description: |
            SEND_NOTIFICATION: userIds (comma-separated) or userId, title, optional body/link.
            CREATE_TASK: projectId, title, optional description/priority/assigneeIds.
            SEND_WEBHOOK: https url, optional secret used for the x-nexus-signature HMAC.
        enabled: { type: boolean, default: true }
        maxRetries: { type: integer, minimum: 0, maximum: 10, default: 3 }
    UpdateAutomationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        enabled: { type: boolean }
    AutomationListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/Automation' }
    AutomationResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Automation' }
    AutomationRunListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/AutomationRun' }
    AutomationRunResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/AutomationRun' }

    # --- AI service (Phases 21-23) -------------------------------------------
    AiHealthResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [configured, status]
          properties:
            configured: { type: boolean }
            status: { type: string, enum: [up, down] }
            latencyMs: { type: number }
            version: { type: string }
            error: { type: string }
    AiSourceReference:
      type: object
      required: [type, id, title]
      properties:
        type: { type: string }
        id: { type: string }
        title: { type: string }
        workspaceId: { type: [string, 'null'], format: uuid }
        projectId: { type: [string, 'null'], format: uuid }
        snippet: { type: string }
    AiUsage:
      type: object
      required: [promptTokens, completionTokens, totalTokens]
      properties:
        promptTokens: { type: integer, minimum: 0 }
        completionTokens: { type: integer, minimum: 0 }
        totalTokens: { type: integer, minimum: 0 }
    AiChatRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        workspaceId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        query: { type: string, minLength: 1, maxLength: 4000 }
        projectId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        meetingId: { type: string, format: uuid }
        contextType: { type: string, maxLength: 60 }
        contextId: { type: string, format: uuid }
    AiChatResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [conversationId, answer, references, model, usage, sources]
          properties:
            conversationId: { type: string, format: uuid }
            answer: { type: string }
            references:
              type: array
              items: { $ref: '#/components/schemas/AiSourceReference' }
            sources:
              type: array
              items: { $ref: '#/components/schemas/AiSourceReference' }
            model: { type: string }
            usage: { $ref: '#/components/schemas/AiUsage' }
    AiConversation:
      type: object
      required: [id, title, status, lastMessageAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        workspaceId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        contextType: { type: [string, 'null'] }
        contextId: { type: [string, 'null'] }
        lastMessageAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AiConversationMessage:
      type: object
      required: [id, role, content, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [USER, ASSISTANT, SYSTEM] }
        content: { type: string }
        status: { type: string, enum: [COMPLETED, FAILED] }
        model: { type: [string, 'null'] }
        tokenCount: { type: [integer, 'null'] }
        references: {}
        createdAt: { type: string, format: date-time }
    AiConversationResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          allOf:
            - $ref: '#/components/schemas/AiConversation'
            - type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  items: { $ref: '#/components/schemas/AiConversationMessage' }
    AiConversationListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items, nextCursor]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AiConversation' }
            nextCursor: { type: [string, 'null'] }
    AiDeleteResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [deleted]
          properties:
            deleted: { type: boolean, const: true }
    AiUsageResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [dailyRequests, dailyRequestLimit, monthlyTokens, monthlyTokenLimit, remainingDailyRequests, remainingMonthlyTokens, since]
          properties:
            dailyRequests: { type: integer }
            dailyRequestLimit: { type: integer }
            monthlyTokens: { type: integer }
            monthlyTokenLimit: { type: integer }
            remainingDailyRequests: { type: integer }
            remainingMonthlyTokens: { type: integer }
            since:
              type: object
              properties:
                day: { type: string, format: date-time }
                month: { type: string, format: date-time }
    AiWritingSuggestion:
      type: object
      required: [id, category, severity, message, original, replacement, offset, length]
      properties:
        id: { type: string }
        category: { type: string, enum: [SPELLING, GRAMMAR, PUNCTUATION, CLARITY, VOCABULARY, TONE, STYLE] }
        severity: { type: string, enum: [low, medium, high] }
        message: { type: string }
        original: { type: string }
        replacement: { type: string }
        offset: { type: integer, minimum: 0 }
        length: { type: integer, minimum: 0 }
        explanation: { type: string }
    AiWritingAnalyzeRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        workspaceId: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 50000 }
        features:
          type: array
          items: { type: string, enum: [SPELLING, GRAMMAR, PUNCTUATION, CLARITY, VOCABULARY, TONE, STYLE] }
        language: { type: string, minLength: 2, maxLength: 20 }
        toneTarget: { type: string, maxLength: 60 }
    AiWritingAnalyzeResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [sessionId, suggestions, usage, expiresAt]
          properties:
            sessionId: { type: string, format: uuid }
            suggestions:
              type: array
              items: { $ref: '#/components/schemas/AiWritingSuggestion' }
            detectedTone: { type: [string, 'null'] }
            summary: { type: [string, 'null'] }
            usage: { $ref: '#/components/schemas/AiUsage' }
            expiresAt: { type: string, format: date-time }
    AiWritingRewriteRequest:
      type: object
      additionalProperties: false
      required: [text, instruction]
      properties:
        workspaceId: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 50000 }
        instruction: { type: string, minLength: 1, maxLength: 1000 }
        tone: { type: string, maxLength: 60 }
    AiWritingRewriteResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [text, usage]
          properties:
            text: { type: string }
            explanation: { type: [string, 'null'] }
            usage: { $ref: '#/components/schemas/AiUsage' }
    AiWritingAcceptRequest:
      type: object
      additionalProperties: false
      required: [suggestionIds]
      properties:
        suggestionIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string }
    AiWritingAcceptResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [sessionId, text, appliedSuggestionIds]
          properties:
            sessionId: { type: string, format: uuid }
            text: { type: string }
            appliedSuggestionIds:
              type: array
              items: { type: string }
    AiWritingDismissResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [sessionId, dismissed]
          properties:
            sessionId: { type: string, format: uuid }
            dismissed: { type: boolean, const: true }
    AiActionProposalRequest:
      type: object
      additionalProperties: false
      required: [workspaceId, actionType, payload]
      properties:
        workspaceId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        actionType: { type: string, enum: [CREATE_TASK, ADD_TASK_COMMENT, COMPLETE_TASK, CREATE_DOCUMENT, SEND_NOTIFICATION] }
        payload: { type: object }
        title: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 2000 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
        sourceReferences:
          type: array
          maxItems: 50
          items:
            type: object
            required: [type, id, title]
            properties:
              type: { type: string }
              id: { type: string }
              title: { type: string }
    AiActionDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 1000 }
    AiActionProposal:
      type: object
      required: [id, workspaceId, actionType, status, title, payload, expiresAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        actionType: { type: string, enum: [CREATE_TASK, ADD_TASK_COMMENT, COMPLETE_TASK, CREATE_DOCUMENT, SEND_NOTIFICATION] }
        status: { type: string, enum: [PROPOSED, APPROVED, REJECTED, EXECUTING, EXECUTED, FAILED, CANCELLED, EXPIRED] }
        title: { type: string }
        summary: { type: [string, 'null'] }
        payload: { type: object }
        sourceReferences: {}
        expiresAt: { type: string, format: date-time }
        approvedAt: { type: [string, 'null'], format: date-time }
        rejectedAt: { type: [string, 'null'], format: date-time }
        executedAt: { type: [string, 'null'], format: date-time }
        executionResult: {}
        failureReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AiActionProposalResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/AiActionProposal' }
    AiActionProposalListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items, nextCursor]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AiActionProposal' }
            nextCursor: { type: [string, 'null'] }
