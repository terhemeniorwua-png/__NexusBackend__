    get:
      tags: [Projects]
      operationId: listWorkspaceProjects
      summary: List projects visible to the caller
      description: Visibility is applied in the database query. PRIVATE requires project ownership or explicit project membership, even when a parent team or department is linked. DEPARTMENT_TEAM inherits from active parent membership. Supports cursor, limit (1–100), status, visibility, teamId, departmentId, search and includeArchived.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: status, in: query, schema: { type: string, enum: [PLANNING, ACTIVE, ON_HOLD, COMPLETED, ARCHIVED] } }
        - { name: visibility, in: query, schema: { type: string, enum: [PRIVATE, DEPARTMENT_TEAM, WORKSPACE] } }
        - { name: teamId, in: query, schema: { type: string, format: uuid } }
        - { name: departmentId, in: query, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: includeArchived, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Cursor page of projects visible to the caller, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectPageResponse' } } } }
        '401': { description: Authentication required. }
        '404': { description: Workspace is unavailable. }
    post:
      tags: [Projects]
      operationId: createWorkspaceProject
      summary: Create a project
      description: Workspace creation permission is required. Owner and initial project-manager membership are assigned by the server.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreateRequest' }
      responses:
        '201': { description: Project created, with initial owner membership, audit record and response summary., content: { application/json: { schema: { $ref: '#/components/schemas/ProjectResponse' } } } }
        '400': { description: Invalid project fields or missing team/department scope for DEPARTMENT_TEAM visibility. }
        '403': { description: Project creation is not permitted. }
        '409': { description: Project key already exists in this workspace. }
  /workspaces/{workspaceId}/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getWorkspaceProject
      summary: Read an authorized project
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Project summary., content: { application/json: { schema: { $ref: '#/components/schemas/ProjectResponse' } } } }
        '404': { description: Project is missing, outside the workspace, or not visible to the caller. }
    patch:
      tags: [Projects]
      operationId: updateWorkspaceProject
      summary: Update project metadata and visibility
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdateRequest' }
      responses:
        '200': { description: Updated project summary., content: { application/json: { schema: { $ref: '#/components/schemas/ProjectResponse' } } } }
        '403': { description: Project mutation is not permitted. }
        '404': { description: Project is missing, archived, outside the workspace, or inaccessible. }
        '409': { description: Duplicate project key or inconsistent team/department scope. }
    delete:
      tags: [Projects]
      operationId: deleteWorkspaceProject
      summary: Soft-delete an authorized project
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Project marked deleted; dependent project data is not hard-deleted. }
        '403': { description: Project deletion is not permitted. }
        '404': { description: Project is missing or inaccessible. }
  /workspaces/{workspaceId}/projects/{projectId}/archive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: archiveWorkspaceProject
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Project status is ARCHIVED. }
        '403': { description: Project archive permission is required. }
        '404': { description: Project is missing or inaccessible. }
  /workspaces/{workspaceId}/projects/{projectId}/transfer-ownership:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: transferProjectOwnership
      summary: Immediately transfer project ownership
      description: The current project owner or a workspace OWNER/PROJECT_MANAGER, including organization owner/admin, may transfer. A project-level manager cannot force-transfer. Archived projects are allowed; soft-deleted or invisible projects return 404. No notification is sent.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferProjectOwnershipRequest' }
      responses:
        '200':
          description: Ownership and the old owner's resulting membership role were changed atomically; one activity entry was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectOwnershipTransferResponse' }
        '400': { description: The requested new owner is already the current owner. }
        '403': { description: The caller can view the project but is neither its owner nor a workspace administrator. }
        '404': { description: The project is invisible, outside the workspace, or soft-deleted. }
        '409': { description: Concurrent ownership change or the manager/owner invariant would be violated. }
        '422': { description: The recipient is inactive, outside the workspace, role-ineligible, or outside the project team/department scope. }
  /workspaces/{workspaceId}/projects/{projectId}/restore:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: restoreWorkspaceProject
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Project is restored to its prior status, or PLANNING if no previous archive record exists. }
        '403': { description: Project restore permission is required. }
        '404': { description: Project is missing or inaccessible. }
  /workspaces/{workspaceId}/projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listProjectMembers
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Authorized project roster. }
        '403': { description: Project roster is not available to this role. }
        '404': { description: Project is missing or inaccessible. }
    post:
      tags: [Projects]
      operationId: addProjectMember
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
                role: { type: string, enum: [PROJECT_MANAGER, MEMBER, VIEWER], default: MEMBER }
      responses:
        '201': { description: Membership created/updated and target notified. }
        '404': { description: Project or active workspace target member is unavailable. }
        '409': { description: Project owner cannot be assigned a non-manager role. }
  /workspaces/{workspaceId}/projects/{projectId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Projects]
      operationId: updateProjectMember
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties: { role: { type: string, enum: [PROJECT_MANAGER, MEMBER, VIEWER] } }
      responses:
        '200': { description: Membership role updated. }
        '403': { description: Project member management is not permitted. }
        '404': { description: Project or membership is unavailable. }
    delete:
      tags: [Projects]
      operationId: removeProjectMember
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Membership removed. }
        '404': { description: Project or membership is unavailable. }
        '409': { description: Project owner cannot be removed. }
  /workspaces/{workspaceId}/projects/{projectId}/activity:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listProjectActivity
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Cursor-paginated project audit events. }
        '404': { description: Project is missing or inaccessible. }
  /workspaces/{workspaceId}/projects/{projectId}/milestones:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listProjectMilestones
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Milestones ordered by position and creation time. }
        '404': { description: Project is missing or inaccessible. }
    post:
      tags: [Projects]
      operationId: createProjectMilestone
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: [string, 'null'], maxLength: 2000 }
                dueDate: { type: [string, 'null'], format: date-time }
                position: { type: integer, minimum: 0, default: 0 }
      responses:
        '201': { description: Created milestone and project activity record. }
        '403': { description: Project update permission is required. }
        '404': { description: Project is missing, archived, or inaccessible. }
  /workspaces/{workspaceId}/projects/{projectId}/milestones/{milestoneId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
      - { name: milestoneId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Projects]
      operationId: updateProjectMilestone
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: [string, 'null'], maxLength: 2000 }
                dueDate: { type: [string, 'null'], format: date-time }
                completed: { type: boolean }
                position: { type: integer, minimum: 0 }
      responses:
        '200': { description: Updated milestone. }
        '404': { description: Project or milestone is missing, archived, or inaccessible. }
    delete:
      tags: [Projects]
      operationId: deleteProjectMilestone
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Milestone deleted. }
        '404': { description: Project or milestone is missing, archived, or inaccessible. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token returned by the login and refresh endpoints.
  parameters:
    CsrfHeader:
      name: x-csrf-token
      in: header
      required: false
      description: Required when the refresh token is read from the `nexus_rt` cookie. The value is returned in the login and refresh responses and in the readable `nexus_csrf` cookie.
      schema:
        type: string
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: The workspace.
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      description: The workspace team.
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      description: The workspace project.
      schema:
        type: string
        format: uuid
    TeamUserId:
      name: userId
      in: path
      required: true
      description: The workspace user whose team membership is targeted.
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: The invitation.
      schema:
        type: string
        format: uuid
    JoinRequestId:
      name: requestId
      in: path
      required: true
      description: The join request.
      schema:
        type: string
        format: uuid
  headers:
    XRequestId:
      description: Request correlation identifier.
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [status, service, version, environment, uptimeSeconds, timestamp]
          properties:
            status:
              type: string
              const: ok
            service:
              type: string
              example: Nexus
            version:
              type: string
              example: 0.1.0
            environment:
              type: string
              enum: [development, test, production]
            uptimeSeconds:
              type: number
            timestamp:
              type: string
              format: date-time
        requestId:
          type: string
    ReadinessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [status, service, version, environment, dependencies, timestamp]
          properties:
            status:
              type: string
              enum: [ready, not_ready]
            service:
              type: string
            version:
              type: string
            environment:
              type: string
              enum: [development, test, production]
            uptimeSeconds:
              type: number
            timestamp:
              type: string
              format: date-time
            requestId:
              type: string
            dependencies:
              type: object
              required: [database, redis]
              properties:
                database:
                  $ref: '#/components/schemas/DependencyStatus'
                redis:
                  $ref: '#/components/schemas/DependencyStatus'
    DependencyStatus:
      type: object
      required: [status, latencyMs]
      properties:
        status:
          type: string
          enum: [up, down]
        latencyMs:
          type: number
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
            details:
              description: Optional structured validation details.
            requestId:
              type: string
    RegisterRequest:
      type: object
      required: [email, name, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          example: ada@example.com
        name:
          type: string
          minLength: 2
          maxLength: 100
        password:
          type: string
          description: |
            At least 8 characters, at most 128 characters and at most 72 bytes,
            with at least one letter and one number. Common passwords are
            rejected.
          minLength: 8
          maxLength: 128
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The single-use token from the emailed link.
    EmailCodeRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\\d{6}$'
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          description: Optional when the `nexus_rt` cookie is sent.
    PasswordResetRequest:
      type: object
      required: [email, code, newPassword]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\\d{6}$'
        newPassword:
          type: string
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    EmailChangeRequest:
      type: object
      required: [email, currentPassword]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        currentPassword:
          type: string
    CurrentPasswordRequest:
      type: object
      required: [currentPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
    AccountDeleteRequest:
      type: object
      required: [currentPassword, confirmation]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
        confirmation:
          type: string
          description: The email address of the account, typed exactly.
    AccountDeletionScheduledResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [status, scheduledDeletionAt]
          properties:
            status:
              type: string
              const: PENDING_DELETION
            scheduledDeletionAt:
              type: string
              format: date-time
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        bio:
          type: [string, 'null']
          maxLength: 500
        jobTitle:
          type: [string, 'null']
          maxLength: 100
        timeZone:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 10
    User:
      type: object
      required: [id, email, name, status, emailVerifiedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DEACTIVATED, PENDING_DELETION]
        emailVerifiedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    UserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'
    RegistrationResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user, verificationRequired]
          properties:
            user:
              $ref: '#/components/schemas/User'
            verificationRequired:
              type: boolean
              const: true
    CurrentUserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user]
          properties:
            user:
              type: object
              required: [id, email, name, status, emailVerified]
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                name:
                  type: string
                status:
                  type: string
                  enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DEACTIVATED, PENDING_DELETION]
                emailVerified:
                  type: boolean
    AuthenticationResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user, accessToken, tokenType, expiresIn, csrfToken, session]
          properties:
            user:
              $ref: '#/components/schemas/User'
            accessToken:
              type: string
              description: 'Send this in the Authorization header as a bearer token.'
            tokenType:
              type: string
              const: Bearer
            expiresIn:
              type: number
              description: The lifetime of the access token in seconds.
            csrfToken:
              type: string
              description: Send this in the `x-csrf-token` header.
            session:
              type: object
              required: [id, expiresAt]
              properties:
                id:
                  type: string
                  format: uuid
                expiresAt:
                  type: string
                  format: date-time
    LoginResponse:
      oneOf:
        - $ref: '#/components/schemas/AuthenticationResponse'
        - $ref: '#/components/schemas/MfaChallengeResponse'
    MfaChallengeResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [twoFactorRequired, challengeToken, expiresIn]
          properties:
            twoFactorRequired: { type: boolean, const: true }
            challengeToken: { type: string, description: Short-lived token accepted only by `/auth/2fa/challenge`. }
            expiresIn: { type: integer, const: 300 }
    TwoFactorChallengeRequest:
      type: object
      additionalProperties: false
      required: [challengeToken]
      properties:
        challengeToken: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
        recoveryCode: { type: string, minLength: 8, maxLength: 32 }
      oneOf:
        - required: [code]
        - required: [recoveryCode]
    TwoFactorCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    TwoFactorDisableRequest:
      type: object
      additionalProperties: false
      required: [currentPassword]
      properties:
        currentPassword: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
        recoveryCode: { type: string, minLength: 8, maxLength: 32 }
      oneOf:
        - required: [code]
        - required: [recoveryCode]
    RecoveryCodeRegenerateRequest:
      type: object
      additionalProperties: false
      properties:
        currentPassword: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
        recoveryCode: { type: string, minLength: 8, maxLength: 32 }
      oneOf:
        - required: [currentPassword]
        - required: [code]
        - required: [recoveryCode]
    TwoFactorSetupResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [otpauthUrl, expiresIn]
          properties:
            otpauthUrl: { type: string, format: uri, description: Secret-bearing URI; show only to the signed-in account owner. }
            expiresIn: { type: integer, const: 600 }
    RecoveryCodesResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [recoveryCodes]
          properties:
            recoveryCodes:
              type: array
              minItems: 10
              maxItems: 10
              items: { type: string, pattern: '^[A-F0-9]{32}$' }
    MessageResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [message]
          properties:
            message:
              type: string
    Session:
      type: object
      required: [id, userAgent, ip, createdAt, lastUsedAt, expiresAt, current]
      properties:
        id:
          type: string
          format: uuid
        userAgent:
          type: [string, 'null']
        ip:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Whether this is the session of the current request.
    ProfileResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user, profile]
          properties:
            user:
              $ref: '#/components/schemas/User'
            profile:
              type: object
              required: [bio, jobTitle, avatarUrl, timeZone, locale]
              properties:
                bio:
                  type: [string, 'null']
                jobTitle:
                  type: [string, 'null']
                avatarUrl:
                  type: [string, 'null']
                timeZone:
                  type: string
                locale:
                  type: string
    WorkspaceRole:
      type: string
      enum: [OWNER, PROJECT_MANAGER, MEMBER, COLLABORATOR, VIEWER]
    OrganizationRole:
      type: string
      description: Workspace-scoped predefined Company or Institution role. Custom roles are deferred.
      enum:
        - COMPANY_OWNER
        - COMPANY_ADMIN
        - COMPANY_PROJECT_MANAGER
        - COMPANY_MEMBER
        - COMPANY_COLLABORATOR
        - COMPANY_VIEWER
        - INSTITUTION_OWNER
        - INSTITUTION_ADMIN
        - INSTITUTION_DEPARTMENT_HEAD
        - INSTITUTION_LECTURER_STAFF
        - INSTITUTION_STUDENT
        - INSTITUTION_COLLABORATOR
        - INSTITUTION_VIEWER
    WorkspaceType:
      type: string
      enum: [INDIVIDUAL, COMPANY, INSTITUTION]
    WorkspaceStatus:
      type: string
      enum: [ACTIVE, ARCHIVED, SUSPENDED]
    WorkspaceVisibility:
      type: string
      enum: [PRIVATE, PUBLIC]
    AssignableRole:
      type: string
      description: The roles a caller may hand out. The owner role is not part of it.
      enum: [PROJECT_MANAGER, MEMBER, COLLABORATOR, VIEWER]
    Workspace:
      type: object
      required:
        - id
        - name
        - slug
        - type
        - isPersonal
        - visibility
        - status
        - ownerId
        - role
        - organizationRole
        - joinCodeEnabled
        - memberCount
        - projectCount
        - teamCount
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        type:
          $ref: '#/components/schemas/WorkspaceType'
        isPersonal:
          type: boolean
          description: Server-managed marker for the account's protected personal workspace.
        visibility:
          $ref: '#/components/schemas/WorkspaceVisibility'
        status:
          $ref: '#/components/schemas/WorkspaceStatus'
        ownerId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        organizationRole:
          oneOf:
            - $ref: '#/components/schemas/OrganizationRole'
            - type: 'null'
        joinCodeEnabled:
          type: boolean
