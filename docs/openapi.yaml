              schema: { $ref: '#/components/schemas/PrivacyRequestResponse' }
        '403':
          description: An active platform privacy reviewer is required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Request has already been decided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /privacy-requests/{requestId}/review:
    post:
      tags: [Users]
      operationId: beginPrivacyRequestReview
