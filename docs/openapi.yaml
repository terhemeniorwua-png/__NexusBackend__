          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /privacy-requests/review:
    get:
      tags: [Users]
      operationId: listPrivacyRequestsForReview
      summary: List privacy requests for authorized platform reviewers
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PrivacyRequestStatus' }
      responses:
