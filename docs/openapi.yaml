              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workspaces/{workspaceId}/teams/{teamId}/invitations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      operationId: listTeamInvitations
      summary: List invitations for a team
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ACCEPTED, DECLINED, REVOKED, EXPIRED, ALL]
            default: ALL
      responses:
        '200':
          description: Team invitations.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Invitation' }
        '403':
          description: The caller cannot manage invitations for this team.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      tags: [Teams]
      operationId: createTeamInvitation
      summary: Invite an active workspace member to a team
      description: |
        The invitee must already have active membership in this workspace.
        Accepting adds team membership only and never creates or changes
        workspace membership. The single-use token is delivered by email and
        is stored only as a digest.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetUserId]
              properties:
                targetUserId: { type: string, format: uuid }
      responses:
        '201':
          description: Team invitation created; `emailSent` reports whether email was queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationResultResponse' }
        '400':
          description: Invalid request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: The caller cannot manage this team.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: The team or active workspace recipient was not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: The team is inactive or an invitation is already pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Invitation rate limit reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces/{workspaceId}/teams/{teamId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [Teams]
      operationId: revokeTeamInvitation
      summary: Revoke a team invitation
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Team invitation revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationResponse' }
        '403':
          description: The caller cannot manage this team.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: The invitation was not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: The invitation has already been accepted, revoked, or changed state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces/{workspaceId}/invitations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: listWorkspaceInvitations
      summary: List the invitations of a workspace
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: The state to filter on. `ALL` returns every invitation.
          schema:
            type: string
            enum: [PENDING, ACCEPTED, DECLINED, REVOKED, EXPIRED, ALL]
            default: ALL
      responses:
        '200':
          description: The invitations.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
        '403':
          description: The role of the caller does not allow this read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Workspaces]
      operationId: createWorkspaceInvitation
      summary: Invite an address and send the invitation
      description: |
        The address may belong to an account or not. A pending invitation for
        the same address and workspace is refused, because the existing one can
        be resent. Creation is serialized per workspace and duplicate pending
        invitations are rejected with `409`, including concurrent requests.

        Invitations cannot be created for an archived or soft-deleted workspace.

        The invitation link is valid for 48 hours by default
        (`WORKSPACE_INVITATION_TTL_SECONDS`). Only the workspace owner may
        invite an address as `PROJECT_MANAGER`; a project manager may invite
        the remaining assignable roles.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: The created invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResultResponse'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The role of the caller does not allow this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The address is a member already or has a pending invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many invitations were sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [Workspaces]
      operationId: revokeWorkspaceInvitation
      summary: Revoke an invitation
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The revoked invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '403':
          description: The role of the caller does not allow this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace or the invitation does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The invitation was accepted or revoked already.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/invitations/{invitationId}/resend:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [Workspaces]
      operationId: resendWorkspaceInvitation
      summary: Send the invitation again
      description: |
        The resend issues a new token, so a link that was sent before stops
        working. The new link is valid for the configured invitation lifetime
        (48 hours by default).

        Resending is allowed only while the workspace and invitation are
        active and pending. The state check and token rotation are atomic.

        A resend re-issues the role stored on the invitation, so it is held to
        the same rule as creating the invitation: only the workspace owner may
        resend a `PROJECT_MANAGER` invitation.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The invitation with its new deadline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResultResponse'
        '403':
          description: The role of the caller does not allow this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace or the invitation does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The invitation was accepted, revoked or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many invitations were sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invitations:
    get:
      tags: [Invitations]
      operationId: listMyInvitations
      summary: The invitations that are addressed to the signed-in account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The invitations.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invitations/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The single-use token of the invitation link.
        schema:
          type: string
    get:
      tags: [Invitations]
      operationId: getInvitation
      summary: The invitation behind the link
      security: []
      description: |
        The token in the URL is the secret of the invitation, so the preview
        needs no session. The address is masked, because a forwarded mail
        carries the link with it.
      responses:
        '200':
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreviewResponse'
        '404':
          description: The token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: The invitation expired, was revoked, was accepted, or its workspace is archived or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invitations/{token}/verify:
    parameters:
      - name: token
        in: path
        required: true
        description: The single-use token of the invitation link.
        schema:
          type: string
    get:
      tags: [Invitations]
      operationId: verifyInvitation
      summary: Verify the invitation for the signed-in account
      description: |
        Answers whether the signed-in account is the intended recipient and
        whether it may accept or decline the invitation. It never accepts the
        invitation and never changes membership.

        Terminal invitation states are reported with HTTP 200 and their real
        status, so the frontend can render "already accepted", "declined",
        "revoked", "expired", "wrong account" or "already a member" without
        treating them as server errors.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The invitation and the viewer's eligibility.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationVerificationResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account has not verified its email address yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many verification requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invitations/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        description: The single-use token of the invitation link.
        schema:
          type: string
    post:
      tags: [Invitations]
      operationId: acceptInvitation
      summary: Accept the invitation and join the workspace
      description: |
        The accepting account has to be the one the invitation was meant for.
        The token works exactly once.

        Only an invitation in the `PENDING` state can be accepted. An
        invitation that has expired, been revoked or already been accepted is
        rejected before any membership is created.

        Workspace availability, the token digest, the pending state, and the
        deadline are rechecked transactionally before membership is granted.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The accepted invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account has not verified its email address yet, or the invitation belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The invitation is no longer pending because it was accepted, revoked or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: The invitation expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invitations/{token}/decline:
    parameters:
      - name: token
        in: path
        required: true
        description: The single-use token of the invitation link.
        schema:
          type: string
    post:
      tags: [Invitations]
      operationId: declineInvitation
      summary: Decline the invitation
      description: |
        Requires authentication as the account the invitation was sent to.
        This single-use transition releases the pending invitation slot so
        the workspace may invite the address again.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The invitation was declined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The invitation belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The invitation token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The invitation is no longer pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: The invitation expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/channels:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Channels]
      operationId: listChannels
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Access-filtered channel page. Non-managers receive active channels only; workspace managers may also list archived channels. }
        '401': { description: Authentication required. }
    post:
      tags: [Channels]
      operationId: createChannel
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, name]
              properties:
                type: { type: string, enum: [WORKSPACE, TEAM, DEPARTMENT, PROJECT, PRIVATE] }
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, nullable: true, maxLength: 500 }
                teamId: { type: string, format: uuid }
                departmentId: { type: string, format: uuid }
                projectId: { type: string, format: uuid }
      responses:
        '201': { description: Channel created; private creator is ADMIN. }
        '400': { description: Invalid channel type/parent combination. }
        '409': { description: Case-insensitive channel name conflict. }
  /workspaces/{workspaceId}/channels/{channelId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: channelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Channels]
      operationId: getChannel
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Active channel for authorized members, or archived channel for a workspace manager (private channels still require explicit membership). }
        '404': { description: Channel is missing, archived and caller is not a workspace manager, or otherwise inaccessible. }
    patch:
      tags: [Channels]
      operationId: updateChannel
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, nullable: true, maxLength: 500 }
      responses:
        '200': { description: Updated active channel summary. Archived channels cannot be updated. }
        '404': { description: Channel is missing, archived, or inaccessible. }
        '409': { description: Case-insensitive channel name conflict. }
    delete:
      tags: [Channels]
      operationId: deleteChannel
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Active or archived channel soft-deleted. }
        '403': { description: Workspace owner or project manager required. }
  /workspaces/{workspaceId}/channels/{channelId}/archive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: channelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Channels]
      operationId: archiveChannel
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Channel archived; workspace managers may repeat this operation on an archived channel. }
        '404': { description: Channel is missing, inaccessible, or archived for a non-manager. }
  /workspaces/{workspaceId}/channels/{channelId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: channelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Channels]
      operationId: addPrivateChannelMember
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId]
              properties: { userId: { type: string, format: uuid } }
      responses:
        '201': { description: Membership created with server-assigned MEMBER role. }
        '400': { description: Membership is available only for private channels. }
        '404': { description: Channel is missing, archived, inaccessible, or target is not an active workspace member. }
  /workspaces/{workspaceId}/channels/{channelId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: channelId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Channels]
      operationId: removePrivateChannelMember
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Membership removed. }
        '404': { description: Channel is missing, archived, inaccessible, or membership does not exist. }

  /workspaces/{workspaceId}/projects:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Projects]
      operationId: listWorkspaceProjects
      summary: List projects visible to the caller
      description: Visibility is applied in the database query. PRIVATE requires project ownership or explicit project membership, even when a parent team or department is linked. DEPARTMENT_TEAM inherits from active parent membership. Supports cursor, limit (1–100), status, visibility, teamId, departmentId, search and includeArchived.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: status, in: query, schema: { type: string, enum: [PLANNING, ACTIVE, ON_HOLD, COMPLETED, ARCHIVED] } }
        - { name: visibility, in: query, schema: { type: string, enum: [PRIVATE, DEPARTMENT_TEAM, WORKSPACE] } }
        - { name: teamId, in: query, schema: { type: string, format: uuid } }
        - { name: departmentId, in: query, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: includeArchived, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Cursor page of projects visible to the caller, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectPageResponse' } } } }
        '401': { description: Authentication required. }
        '404': { description: Workspace is unavailable. }
    post:
      tags: [Projects]
      operationId: createWorkspaceProject
      summary: Create a project
      description: Workspace creation permission is required. Owner and initial project-manager membership are assigned by the server.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreateRequest' }
      responses:
        '201': { description: Project created, with initial owner membership, audit record and response summary., content: { application/json: { schema: { $ref: '#/components/schemas/ProjectResponse' } } } }
        '400': { description: Invalid project fields or missing team/department scope for DEPARTMENT_TEAM visibility. }
        '403': { description: Project creation is not permitted. }
        '409': { description: Project key already exists in this workspace. }
  /workspaces/{workspaceId}/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getWorkspaceProject
      summary: Read an authorized project
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Project summary., content: { application/json: { schema: { $ref: '#/components/schemas/ProjectResponse' } } } }
        '404': { description: Project is missing, outside the workspace, or not visible to the caller. }
    patch:
      tags: [Projects]
      operationId: updateWorkspaceProject
      summary: Update project metadata and visibility
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdateRequest' }
      responses:
        '200': { description: Updated project summary., content: { application/json: { schema: { $ref: '#/components/schemas/ProjectResponse' } } } }
        '403': { description: Project mutation is not permitted. }
        '404': { description: Project is missing, archived, outside the workspace, or inaccessible. }
        '409': { description: Duplicate project key or inconsistent team/department scope. }
    delete:
      tags: [Projects]
      operationId: deleteWorkspaceProject
      summary: Soft-delete an authorized project
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Project marked deleted; dependent project data is not hard-deleted. }
        '403': { description: Project deletion is not permitted. }
        '404': { description: Project is missing or inaccessible. }
  /workspaces/{workspaceId}/projects/{projectId}/archive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: archiveWorkspaceProject
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Project status is ARCHIVED. }
        '403': { description: Project archive permission is required. }
        '404': { description: Project is missing or inaccessible. }
  /workspaces/{workspaceId}/projects/{projectId}/transfer-ownership:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: transferProjectOwnership
      summary: Immediately transfer project ownership
      description: The current project owner or a workspace OWNER/PROJECT_MANAGER, including organization owner/admin, may transfer. A project-level manager cannot force-transfer. Archived projects are allowed; soft-deleted or invisible projects return 404. No notification is sent.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferProjectOwnershipRequest' }
      responses:
        '200':
          description: Ownership and the old owner's resulting membership role were changed atomically; one activity entry was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectOwnershipTransferResponse' }
        '400': { description: The requested new owner is already the current owner. }
        '403': { description: The caller can view the project but is neither its owner nor a workspace administrator. }
        '404': { description: The project is invisible, outside the workspace, or soft-deleted. }
        '409': { description: Concurrent ownership change or the manager/owner invariant would be violated. }
        '422': { description: The recipient is inactive, outside the workspace, role-ineligible, or outside the project team/department scope. }
  /workspaces/{workspaceId}/projects/{projectId}/restore:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: restoreWorkspaceProject
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Project is restored to its prior status, or PLANNING if no previous archive record exists. }
        '403': { description: Project restore permission is required. }
        '404': { description: Project is missing or inaccessible. }
  /workspaces/{workspaceId}/projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listProjectMembers
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Authorized project roster. }
        '403': { description: Project roster is not available to this role. }
        '404': { description: Project is missing or inaccessible. }
    post:
      tags: [Projects]
      operationId: addProjectMember
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
                role: { type: string, enum: [PROJECT_MANAGER, MEMBER, VIEWER], default: MEMBER }
      responses:
        '201': { description: Membership created/updated and target notified. }
        '404': { description: Project or active workspace target member is unavailable. }
        '409': { description: Project owner cannot be assigned a non-manager role. }
  /workspaces/{workspaceId}/projects/{projectId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Projects]
      operationId: updateProjectMember
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties: { role: { type: string, enum: [PROJECT_MANAGER, MEMBER, VIEWER] } }
      responses:
        '200': { description: Membership role updated. }
        '403': { description: Project member management is not permitted. }
        '404': { description: Project or membership is unavailable. }
    delete:
      tags: [Projects]
      operationId: removeProjectMember
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Membership removed. }
        '404': { description: Project or membership is unavailable. }
        '409': { description: Project owner cannot be removed. }
  /workspaces/{workspaceId}/projects/{projectId}/activity:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listProjectActivity
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Cursor-paginated project audit events. }
        '404': { description: Project is missing or inaccessible. }
  /workspaces/{workspaceId}/projects/{projectId}/milestones:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listProjectMilestones
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Milestones ordered by position and creation time. }
        '404': { description: Project is missing or inaccessible. }
    post:
      tags: [Projects]
      operationId: createProjectMilestone
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: [string, 'null'], maxLength: 2000 }
                dueDate: { type: [string, 'null'], format: date-time }
                position: { type: integer, minimum: 0, default: 0 }
      responses:
        '201': { description: Created milestone and project activity record. }
        '403': { description: Project update permission is required. }
        '404': { description: Project is missing, archived, or inaccessible. }
  /workspaces/{workspaceId}/projects/{projectId}/milestones/{milestoneId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
      - { name: milestoneId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Projects]
      operationId: updateProjectMilestone
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: [string, 'null'], maxLength: 2000 }
                dueDate: { type: [string, 'null'], format: date-time }
                completed: { type: boolean }
                position: { type: integer, minimum: 0 }
      responses:
        '200': { description: Updated milestone. }
        '404': { description: Project or milestone is missing, archived, or inaccessible. }
    delete:
      tags: [Projects]
      operationId: deleteProjectMilestone
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Milestone deleted. }
        '404': { description: Project or milestone is missing, archived, or inaccessible. }

  /workspaces/{workspaceId}/automations:
