          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: An active account is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /privacy-requests/mine/{requestId}:
    get:
      tags: [Users]
      operationId: getMyPrivacyRequest
