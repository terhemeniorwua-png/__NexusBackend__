                $ref: '#/components/schemas/IncomingOwnershipTransfersResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workspaces/{workspaceId}/owner-transfers/{transferId}/accept:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: transferId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Workspaces]
      operationId: acceptWorkspaceOwnershipTransfer
      summary: Accept a pending workspace ownership transfer
      description: The intended active workspace member accepts. An active subscription leaves the workspace suspended until billing responsibility is separately accepted.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ownership accepted; billing acceptance may still be required.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required: [workspaceId, billingAcceptanceRequired]
                    properties:
                      workspaceId: { type: string, format: uuid }
                      billingAcceptanceRequired: { type: boolean }
        '403':
          description: The caller is not the intended active recipient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No pending transfer was found for the recipient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The transfer expired or the owner, recipient, or workspace state changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workspaces/{workspaceId}/owner-transfers/{transferId}/reject:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: transferId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Workspaces]
      operationId: rejectWorkspaceOwnershipTransfer
      summary: Reject a pending ownership transfer
      description: Only the intended active recipient can reject a matching unexpired transfer. Rejection never accepts billing responsibility.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Transfer rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnershipTransferDecisionResponse'
        '404':
          description: No matching pending transfer was found for the caller and workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The transfer expired and was recorded as expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workspaces/{workspaceId}/owner-transfers/{transferId}/billing-acceptance:
    parameters:
