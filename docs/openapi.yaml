                    type: boolean
                    const: true
                  data:
                    type: object
                    required: [sessions]
                    properties:
                      sessions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Session'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: The signed-in account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The signed-in account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password/forgot:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Request a password reset code
      security: []
      description: The response is identical whether or not the address is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: The request was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '429':
          description: Too many password requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password/reset:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Set a new password with a six-digit reset code
      security: []
      description: Every existing session of the account is revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: The password was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: The token is invalid, expired or has already been used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password/change:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change the password of the signed-in account
      description: Every other session of the account is revoked.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: The password was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: The current password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/email/change:
    post:
      tags: [Authentication]
      operationId: requestEmailChange
      summary: Request an email address change
      description: A confirmation link is sent to the new address. The address only changes once it is confirmed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
      responses:
        '200':
          description: The confirmation link was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
