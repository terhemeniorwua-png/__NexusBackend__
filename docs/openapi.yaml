  /workspaces/{workspaceId}/archive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: archiveWorkspace
      summary: Archive a workspace
      description: |
        Archiving and invitation invalidation are atomic. Pending invitations
        whose deadline has passed become `EXPIRED`; all other pending
        invitations become `REVOKED`. Restoring the workspace does not
        reactivate those invitations.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The archived workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '403':
          description: Only the owner may archive a workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace does not exist.
          content:
