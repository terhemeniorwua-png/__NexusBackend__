      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrivacyRequest'
      responses:
        '201':
          description: Request submitted for review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyRequestResponse'
        '400':
          description: Request fields or redaction target are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A verified active account is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /privacy-requests/mine:
    get:
      tags: [Users]
      operationId: listMyPrivacyRequests
      summary: List the caller's privacy requests
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
