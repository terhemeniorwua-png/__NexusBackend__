          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Workspaces]
      operationId: createWorkspaceInvitation
      summary: Invite an address and send the invitation
      description: |
        The address may belong to an account or not. A pending invitation for
        the same address and workspace is refused, because the existing one can
        be resent.

        The invitation link is valid for 48 hours by default
        (`WORKSPACE_INVITATION_TTL_SECONDS`). Only the workspace owner may
        invite an address as `PROJECT_MANAGER`; a project manager may invite
        the remaining assignable roles.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: The created invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResultResponse'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The role of the caller does not allow this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The address is a member already or has a pending invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many invitations were sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [Workspaces]
      operationId: revokeWorkspaceInvitation
      summary: Revoke an invitation
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The revoked invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '403':
          description: The role of the caller does not allow this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace or the invitation does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The invitation was accepted or revoked already.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/invitations/{invitationId}/resend:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [Workspaces]
      operationId: resendWorkspaceInvitation
      summary: Send the invitation again
      description: |
        The resend issues a new token, so a link that was sent before stops
        working. The new link is valid for the configured invitation lifetime
        (48 hours by default).

        A resend re-issues the role stored on the invitation, so it is held to
        the same rule as creating the invitation: only the workspace owner may
        resend a `PROJECT_MANAGER` invitation.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The invitation with its new deadline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResultResponse'
        '403':
          description: The role of the caller does not allow this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace or the invitation does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The invitation was accepted, revoked or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many invitations were sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invitations:
    get:
      tags: [Invitations]
      operationId: listMyInvitations
      summary: The invitations that are addressed to the signed-in account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The invitations.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invitations/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The single-use token of the invitation link.
        schema:
          type: string
    get:
      tags: [Invitations]
      operationId: getInvitation
      summary: The invitation behind the link
      description: |
        The token in the URL is the secret of the invitation, so the preview
        needs no session. The address is masked, because a forwarded mail
        carries the link with it.
      responses:
        '200':
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreviewResponse'
        '404':
          description: The token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: The invitation expired, was revoked or was accepted already.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invitations/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        description: The single-use token of the invitation link.
        schema:
          type: string
    post:
      tags: [Invitations]
      operationId: acceptInvitation
      summary: Accept the invitation and join the workspace
      description: |
        The accepting account has to be the one the invitation was meant for.
        The token works exactly once.

        Only an invitation in the `PENDING` state can be accepted. An
        invitation that has expired, been revoked or already been accepted is
        rejected before any membership is created.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The accepted invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account has not verified its email address yet, or the invitation belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The invitation is no longer pending because it was accepted, revoked or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: The invitation expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invitations/{token}/decline:
    parameters:
      - name: token
        in: path
        required: true
        description: The single-use token of the invitation link.
        schema:
          type: string
    post:
      tags: [Invitations]
      operationId: declineInvitation
      summary: Decline the invitation
      description: |
        Requires authentication as the account the invitation was sent to.
        This single-use transition releases the pending invitation slot so
        the workspace may invite the address again.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The invitation was declined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The invitation belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The invitation token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The invitation is no longer pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: The invitation expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token returned by the login and refresh endpoints.
  parameters:
    CsrfHeader:
      name: x-csrf-token
      in: header
      required: false
      description: Required when the refresh token is read from the `nexus_rt` cookie. The value is returned in the login and refresh responses and in the readable `nexus_csrf` cookie.
      schema:
        type: string
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: The workspace.
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: The invitation.
      schema:
        type: string
        format: uuid
    JoinRequestId:
      name: requestId
      in: path
      required: true
      description: The join request.
      schema:
        type: string
        format: uuid
  headers:
    XRequestId:
      description: Request correlation identifier.
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [status, service, version, environment, uptimeSeconds, timestamp]
          properties:
            status:
              type: string
              const: ok
            service:
              type: string
              example: Nexus
            version:
              type: string
              example: 0.1.0
            environment:
              type: string
              enum: [development, test, production]
            uptimeSeconds:
              type: number
            timestamp:
              type: string
              format: date-time
        requestId:
          type: string
    ReadinessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [status, service, version, environment, dependencies, timestamp]
          properties:
            status:
              type: string
              enum: [ready, not_ready]
            service:
              type: string
            version:
              type: string
            environment:
              type: string
              enum: [development, test, production]
            uptimeSeconds:
              type: number
            timestamp:
              type: string
              format: date-time
            requestId:
              type: string
            dependencies:
              type: object
              required: [database, redis]
              properties:
                database:
                  $ref: '#/components/schemas/DependencyStatus'
                redis:
                  $ref: '#/components/schemas/DependencyStatus'
    DependencyStatus:
      type: object
      required: [status, latencyMs]
      properties:
        status:
          type: string
          enum: [up, down]
        latencyMs:
          type: number
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
            details:
              description: Optional structured validation details.
            requestId:
              type: string
    RegisterRequest:
      type: object
      required: [email, name, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          example: ada@example.com
        name:
          type: string
          minLength: 2
          maxLength: 100
        password:
          type: string
          description: |
            At least 8 characters, at most 128 characters and at most 72 bytes,
            with at least one letter and one number. Common passwords are
            rejected.
          minLength: 8
          maxLength: 128
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The single-use token from the emailed link.
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          description: Optional when the `nexus_rt` cookie is sent.
    PasswordResetRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
        password:
          type: string
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    EmailChangeRequest:
      type: object
      required: [email, currentPassword]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        currentPassword:
          type: string
    CurrentPasswordRequest:
      type: object
      required: [currentPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
    AccountDeleteRequest:
      type: object
      required: [currentPassword, confirmation]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
        confirmation:
          type: string
          description: The email address of the account, typed exactly.
    AccountDeletionScheduledResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [status, scheduledDeletionAt, recoveryMethod]
          properties:
            status:
              type: string
              const: PENDING_DELETION
            scheduledDeletionAt:
              type: string
              format: date-time
            recoveryMethod:
              type: string
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        bio:
          type: [string, 'null']
          maxLength: 500
        jobTitle:
          type: [string, 'null']
          maxLength: 100
        avatarUrl:
          type: [string, 'null']
          format: uri
        timeZone:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 10
    User:
      type: object
      required: [id, email, name, status, emailVerifiedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DEACTIVATED, PENDING_DELETION]
        emailVerifiedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    UserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'
    RegistrationResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user, verificationRequired]
          properties:
            user:
              $ref: '#/components/schemas/User'
            verificationRequired:
              type: boolean
              const: true
    CurrentUserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user]
          properties:
            user:
              type: object
              required: [id, email, name, status, emailVerified]
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                name:
                  type: string
                status:
                  type: string
                  enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DEACTIVATED, PENDING_DELETION]
                emailVerified:
                  type: boolean
    AuthenticationResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user, accessToken, tokenType, expiresIn, csrfToken, session]
          properties:
            user:
              $ref: '#/components/schemas/User'
            accessToken:
              type: string
              description: 'Send this in the Authorization header as a bearer token.'
            tokenType:
              type: string
              const: Bearer
            expiresIn:
              type: number
              description: The lifetime of the access token in seconds.
            csrfToken:
              type: string
              description: Send this in the `x-csrf-token` header.
            session:
              type: object
              required: [id, expiresAt]
              properties:
                id:
                  type: string
                  format: uuid
                expiresAt:
                  type: string
                  format: date-time
    MessageResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [message]
          properties:
            message:
              type: string
    Session:
      type: object
      required: [id, userAgent, ip, createdAt, lastUsedAt, expiresAt, current]
      properties:
        id:
          type: string
          format: uuid
        userAgent:
          type: [string, 'null']
        ip:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Whether this is the session of the current request.
    ProfileResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user, profile]
          properties:
            user:
              $ref: '#/components/schemas/User'
            profile:
              type: object
              required: [bio, jobTitle, avatarUrl, timeZone, locale]
              properties:
                bio:
                  type: [string, 'null']
                jobTitle:
                  type: [string, 'null']
                avatarUrl:
                  type: [string, 'null']
                timeZone:
                  type: string
                locale:
                  type: string
    WorkspaceRole:
      type: string
      enum: [OWNER, PROJECT_MANAGER, MEMBER, COLLABORATOR, VIEWER]
    WorkspaceType:
      type: string
      enum: [INDIVIDUAL, COMPANY, INSTITUTION]
    WorkspaceVisibility:
      type: string
      enum: [PRIVATE, PUBLIC]
    AssignableRole:
      type: string
      description: The roles a caller may hand out. The owner role is not part of it.
      enum: [PROJECT_MANAGER, MEMBER, COLLABORATOR, VIEWER]
    Workspace:
      type: object
      required:
        - id
        - name
        - slug
        - type
        - isPersonal
        - visibility
        - status
        - ownerId
        - role
        - joinCodeEnabled
        - memberCount
        - projectCount
        - teamCount
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        type:
          $ref: '#/components/schemas/WorkspaceType'
        isPersonal:
          type: boolean
          description: Server-managed marker for the account's protected personal workspace.
        visibility:
          $ref: '#/components/schemas/WorkspaceVisibility'
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        ownerId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        joinCodeEnabled:
          type: boolean
          description: Indicates whether a join code exists. The code itself is never included in workspace responses.
        memberCount:
          type: integer
        projectCount:
          type: integer
        teamCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkspaceResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Workspace'
    WorkspaceDeletedResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [id, deleted]
          properties:
            id:
              type: string
              format: uuid
            deleted:
              type: boolean
    WorkspaceMember:
      type: object
      required: [id, userId, name, email, status, role, membershipStatus, joinedAt, owner]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DEACTIVATED, PENDING_DELETION]
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        membershipStatus:
          type: string
          enum: [ACTIVE, SUSPENDED]
        joinedAt:
          type: string
          format: date-time
        owner:
          type: boolean
    WorkspaceMemberResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/WorkspaceMember'
    Invitation:
      type: object
      required:
        - id
        - workspaceId
        - workspaceName
        - email
        - role
        - type
        - status
        - invitedBy
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        type:
          type: string
          enum: [WORKSPACE, TEAM, PROJECT]
        status:
          type: string
          enum: [PENDING, ACCEPTED, DECLINED, REVOKED, EXPIRED]
        invitedBy:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: [string, 'null']
          format: date-time
        declinedAt:
          type: [string, 'null']
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    InvitationResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Invitation'
    InvitationResultResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [invitation, emailSent]
          properties:
            invitation:
              $ref: '#/components/schemas/Invitation'
            emailSent:
              type: boolean
              description: False when the invitation could not be handed to the mail provider.
    InvitationPreviewResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
            - workspace
            - invitedBy
            - role
            - status
            - expiresAt
            - maskedEmail
            - boundToAccount
          properties:
            workspace:
              type: object
              required: [id, name, slug]
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                slug:
                  type: string
            invitedBy:
              type: object
              required: [id, name]
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
            role:
              $ref: '#/components/schemas/WorkspaceRole'
            status:
              type: string
              enum: [PENDING, ACCEPTED, DECLINED, REVOKED, EXPIRED]
            expiresAt:
              type: string
              format: date-time
            maskedEmail:
              type: string
              example: p***@example.com
            boundToAccount:
              type: boolean
    DiscoveredWorkspace:
      type: object
      required: [id, name, slug, description, type, memberCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        type:
          $ref: '#/components/schemas/WorkspaceType'
        memberCount:
          type: integer
    DiscoveredWorkspacesResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveredWorkspace'
    JoinRequest:
      type: object
      required: [id, workspaceId, workspaceName, userId, userName, userEmail, status, role, teamId, message, reviewedBy, reviewedAt, decisionNote, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        userId:
          type: string
          format: uuid
        userName:
          type: string
        userEmail:
          type: string
          format: email
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, WITHDRAWN, EXPIRED]
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        teamId:
          type: [string, 'null']
          format: uuid
        message:
          type: [string, 'null']
        reviewedBy:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
            - type: 'null'
        reviewedAt:
          type: [string, 'null']
          format: date-time
        decisionNote:
          type: [string, 'null']
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    JoinRequestResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/JoinRequest'
    JoinRequestsResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/JoinRequest'
    JoinCodeResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [workspaceId, code, link]
          properties:
            workspaceId:
              type: string
              format: uuid
            code:
              type: string
              description: Secret plaintext join code. It is returned only when generated or rotated.
            link:
              type: string
              format: uri
    JoinCodeDisabledResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [workspaceId, joinCodeEnabled]
          properties:
            workspaceId:
              type: string
              format: uuid
            joinCodeEnabled:
              type: boolean
              const: false
    CreateWorkspaceRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: [string, 'null']
          maxLength: 500
        slug:
          type: string
          description: The public address of the workspace. A readable slug is derived from the name when it is missing.
          minLength: 2
          maxLength: 50
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        type:
          allOf:
            - $ref: '#/components/schemas/WorkspaceType'
          default: COMPANY
        visibility:
          allOf:
            - $ref: '#/components/schemas/WorkspaceVisibility'
          default: PRIVATE
    UpdateWorkspaceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: [string, 'null']
          maxLength: 500
        visibility:
          $ref: '#/components/schemas/WorkspaceVisibility'
    CreateJoinRequestRequest:
      type: object
      additionalProperties: false
      properties:
        message:
          type: [string, 'null']
          maxLength: 500
    JoinByCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 20
          maxLength: 200
        message:
          type: [string, 'null']
          maxLength: 500
    ApproveJoinRequestRequest:
      type: object
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/AssignableRole'
        teamId:
          type: [string, 'null']
          format: uuid
    RejectJoinRequestRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: [string, 'null']
          maxLength: 500
    AddMemberRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        role:
          allOf:
            - $ref: '#/components/schemas/AssignableRole'
          default: MEMBER
    UpdateMemberRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/AssignableRole'
    CreateInvitationRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        role:
          allOf:
            - $ref: '#/components/schemas/AssignableRole'
          default: MEMBER
    EmailWebhookResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [received, outcome]
          properties:
            received:
              type: boolean
              const: true
            outcome:
              type: string
              description: |
                How the event was handled.
                - `processed` — the event changed the delivery state.
                - `duplicate` — the event was already applied.
                - `ignored` — the event carries no known action.
                - `unmatched` — the event refers to an unknown message.
              enum: [processed, duplicate, ignored, unmatched]
