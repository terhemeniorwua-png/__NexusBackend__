                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: userId
        in: path
        required: true
        description: The account whose membership is changed.
        schema:
          type: string
          format: uuid
    patch:
      tags: [Workspaces]
      operationId: updateWorkspaceMemberRole
      summary: Change the role of a member
      description: |
        The owner role is not part of the request: a workspace has exactly one
        owner and that role cannot be transferred.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: The updated membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberResponse'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The role of the caller does not allow this change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace or the membership does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Workspaces]
      operationId: removeWorkspaceMember
      summary: Remove a member
      description: |
        Removes a member from this workspace. If they hold active assignments
        on open tasks, provide an eligible replacement who is an active member
        of this workspace and can access every affected project. Assignment
        changes, audit records, notifications, and membership removal are
        applied atomically; assignment email notices are sent after commit.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reassignTasksToUserId:
                  type: string
                  format: uuid
                  description: Active workspace member eligible to access all affected projects.
      responses:
        '200':
          description: The member was removed.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required: [userId, removed]
                    properties:
                      userId:
                        type: string
                        format: uuid
                      removed:
                        type: boolean
        '403':
          description: The role of the caller does not allow this change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace or the membership does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active task assignments require an eligible replacement before removal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/owner/{userId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: userId
        in: path
        required: true
        description: The id of the member who will become the new owner.
        schema:
          type: string
          format: uuid
    patch:
      tags: [Workspaces]
      operationId: transferWorkspaceOwnership
      summary: Transfer workspace ownership
      description: |
        Starts a pending ownership transfer to an existing member. The current
        owner must initiate; the recipient must explicitly accept. Subscription
        billing responsibility is accepted separately.

        Only the current owner may call this endpoint. The new owner must
        already be an active member. The workspace owner does not change until
        recipient acceptance. If an active subscription exists, the workspace
        remains suspended until the new owner separately accepts billing
        responsibility.

        Error codes:
        - `TRANSFER_TO_SELF` — the caller is already the owner.
        - `MEMBER_NOT_FOUND` — the target user is not a member of the workspace.
        - `INSUFFICIENT_ROLE` — the caller is not the owner.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                newOwnerRole:
                  type: string
                  enum: [PROJECT_MANAGER, MEMBER, COLLABORATOR, VIEWER]
                  default: PROJECT_MANAGER
                  description: |
                    The role assigned to the previous owner after the transfer.
                    Defaults to `PROJECT_MANAGER`.
              additionalProperties: false
      responses:
        '200':
          description: Transfer request created; ownership is unchanged until recipient acceptance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnershipTransferInitiationResponse'
        '400':
          description: Invalid request body or the caller tried to transfer to themselves.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller is not the workspace owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace does not exist or the target user is not a member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

