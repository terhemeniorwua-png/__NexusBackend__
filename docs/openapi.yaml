          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No accepted transfer was found for the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Billing acceptance is not required or the transfer expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

