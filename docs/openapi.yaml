        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Request owned by the authenticated caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyRequestResponse' }
        '404':
