openapi: 3.1.0
info:
  title: Nexus Backend API
  version: 0.1.0
  description: |
    Nexus workspace and project management backend.

    Phase 1 provides the foundation (health, configuration, error contract).
    Phase 3 adds the account lifecycle: registration, email verification,
    sessions, password recovery and profile management.
    Phase 4 adds the transactional email provider webhook.
    Phase 5 adds workspaces, their members and the invitations that grant
    access to a workspace.

    Authentication model:
    - The access token is a short-lived JWT returned in the response body and
      sent in the `Authorization: Bearer <token>` header. It is never stored
      in a cookie, so business endpoints are not vulnerable to CSRF.
    - The refresh token is an opaque random value delivered in the httpOnly
      `nexus_rt` cookie. Only its SHA-256 digest is stored in PostgreSQL.
    - The refresh token rotates on every use. Presenting a rotated token
      revokes every session of the account.
    - Requests that rely on the `nexus_rt` cookie must also send the CSRF
      token in the `x-csrf-token` header. The `nexus_csrf` cookie alone is
      not accepted, because a browser attaches cookies to cross-site requests
      automatically.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development server
tags:
  - name: Health
    description: Application liveness and dependency readiness
  - name: Authentication
    description: Account registration, verification, sessions and recovery
  - name: Users
    description: The signed-in user's own profile
  - name: Webhooks
    description: Email provider callbacks, authenticated by HMAC signature
  - name: Workspaces
    description: Workspaces, their members and their invitations
  - name: Invitations
    description: Invitation links, their preview and their acceptance
paths:
  /health:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Application liveness
      description: Returns 200 when the HTTP process is running.
      responses:
        '200':
          description: The application process is alive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/live:
    get:
      tags: [Health]
      operationId: getLivenessAlias
      summary: Application liveness
      responses:
        '200':
          description: The application process is alive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Dependency readiness
      description: Checks PostgreSQL and Redis with configured timeouts.
      responses:
        '200':
          description: All required dependencies are available.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: One or more required dependencies are unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Create an account
      description: |
        Creates a `PENDING_VERIFICATION` account and sends a verification link.
        The password is never echoed back and is never included in an email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account was created and is waiting for verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An account with this email address already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many accounts were created from this address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/verify-email:
    post:
      tags: [Authentication]
      operationId: verifyEmail
      summary: Activate an account with an emailed token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: The account is active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: The token is invalid, expired or has already been used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/resend-verification:
    post:
      tags: [Authentication]
      operationId: resendVerification
      summary: Request a new verification link
      description: The response is identical whether or not the address is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: The request was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The session was created.
          headers:
            Set-Cookie:
              description: The `nexus_rt` and `nexus_csrf` cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '401':
          description: The email address or password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account is suspended or deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many sign-in attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate the session
      description: |
        The refresh token is read from the `nexus_rt` cookie or from the
        request body. A cookie authenticated request must also send the
        `x-csrf-token` header.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new access token and refresh token were issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '401':
          description: The refresh token is invalid, expired or was already rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The CSRF token is missing or does not match the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: End the current session
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: The session was revoked.
  /auth/logout-all:
    post:
      tags: [Authentication]
      operationId: logoutAll
      summary: End every session of the account
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Every session was revoked.
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/sessions:
    get:
      tags: [Authentication]
      operationId: listSessions
      summary: List the active sessions of the account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The active sessions.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required: [sessions]
                    properties:
                      sessions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Session'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: The signed-in account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The signed-in account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password/forgot:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Request a password reset link
      description: The response is identical whether or not the address is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: The request was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '429':
          description: Too many password requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password/reset:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: Every existing session of the account is revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: The password was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: The token is invalid, expired or has already been used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password/change:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change the password of the signed-in account
      description: Every other session of the account is revoked.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: The password was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: The current password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/email/change:
    post:
      tags: [Authentication]
      operationId: requestEmailChange
      summary: Request an email address change
      description: A confirmation link is sent to the new address. The address only changes once it is confirmed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
      responses:
        '200':
          description: The confirmation link was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: The current password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The new address is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/email/change/confirm:
    post:
      tags: [Authentication]
      operationId: confirmEmailChange
      summary: Confirm an email address change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: The address was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: The token is invalid, expired or has already been used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/deactivate:
    post:
      tags: [Authentication]
      operationId: deactivateAccount
      summary: Deactivate the signed-in account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentPasswordRequest'
      responses:
        '204':
          description: The account was deactivated and every session was revoked.
        '401':
          description: The current password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/delete:
    post:
      tags: [Authentication]
      operationId: deleteAccount
      summary: Delete the signed-in account
      description: |
        The account is anonymised: the address is released, the profile is
        cleared and every session is revoked. The owner of an active workspace
        must transfer ownership first.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeleteRequest'
      responses:
        '204':
          description: The account was deleted.
        '400':
          description: The confirmation does not match the email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The current password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The account still owns an active workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/me:
    get:
      tags: [Users]
      operationId: getProfile
      summary: The profile of the signed-in account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account has not verified its email address yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Users]
      operationId: updateProfile
      summary: Update the profile of the signed-in account
      description: The email address and the account status cannot be changed here.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account has not verified its email address yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webhooks/email:
    post:
      tags: [Webhooks]
      operationId: receiveEmailWebhook
      summary: Provider delivery, bounce and complaint events
      description: |
        Public endpoint called by the email provider. The request is
        authenticated by an HMAC signature over the raw request body, not by a
        session.

        The signature is read from the header named by
        `EMAIL_WEBHOOK_SIGNATURE_HEADER` (`x-nexus-signature` by default) and
        must be one of:

        - `sha256=<hex digest>` — the HMAC-SHA256 of the raw body.
        - `t=<unix seconds>,v1=<hex digest>` — the HMAC-SHA256 of
          `<unix seconds>.<raw body>`. The timestamp must be inside
          `EMAIL_WEBHOOK_TOLERANCE_SECONDS`.

        The endpoint answers `200` for every verified payload, including
        payloads that carry an unknown event, so the provider does not retry a
        message that will never be understood. Repeated events are applied
        once. A bounced or complained address is added to the suppression
        list and stops receiving mail.

        Brevo does not sign its events. The `/webhooks/email/{token}` route
        accepts the same payload and authenticates it with the shared token
        of the URL.
      parameters:
        - name: x-nexus-signature
          in: header
          required: false
          description: HMAC-SHA256 signature of the raw payload.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              delivered:
                summary: A provider delivery report
                value:
                  type: delivered
                  data:
                    email_id: 01J8Z0Q9W4
                  created_at: 2026-10-21T12:00:00.000Z
              bounced:
                summary: A provider bounce report
                value:
                  type: bounced
                  data:
                    email_id: 01J8Z0Q9W4
                    bounce:
                      type: permanent
                  created_at: 2026-10-21T12:05:00.000Z
      responses:
        '200':
          description: The payload was received and verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailWebhookResponse'
        '400':
          description: The payload is empty or cannot be processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The signature is missing or not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The deployment has no webhook secret configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webhooks/email/{token}:
    post:
      tags: [Webhooks]
      operationId: receiveEmailWebhookWithToken
      summary: Provider events authenticated with the token of the URL
      description: |
        The same endpoint for providers that do not sign their events, Brevo
        among them. The token is the shared secret of the URL and is compared
        in constant time.
      parameters:
        - name: token
          in: path
          required: true
          description: The shared token of the webhook URL.
          schema:
            type: string
            minLength: 32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              brevoDelivered:
                summary: A Brevo delivery report
                value:
                  event: delivered
                  email: someone@example.com
                  message_id: <delivery-id@example.com>
                  ts: 1790000000
      responses:
        '200':
          description: The payload was received and verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailWebhookResponse'
        '400':
          description: The payload is empty or cannot be processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The token is missing or not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The deployment has no webhook secret configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces:
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create a workspace
      description: The creator becomes the owner of the workspace.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: The created workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account has not verified its email address yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: The workspaces the caller belongs to
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The workspaces of the caller.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Read one workspace
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller does not belong to the workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Workspaces]
      operationId: updateWorkspace
      summary: Change the name or the description of a workspace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: The updated workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The role of the caller does not allow this change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Workspaces]
      operationId: deleteWorkspace
      summary: Delete a workspace
      description: |
        The workspace is removed softly, so the records that point at it keep
        their history. The pending invitations of the workspace are revoked.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The workspace was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDeletedResponse'
        '403':
          description: The role of the caller does not allow this change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/archive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: archiveWorkspace
      summary: Archive a workspace
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The archived workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '403':
          description: Only the owner may archive a workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/switch:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: switchWorkspace
      summary: Validate the membership and return the workspace to work in
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The workspace and the role of the caller in it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '403':
          description: The caller does not belong to the workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: listWorkspaceMembers
      summary: List the members of a workspace
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The members.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkspaceMember'
        '403':
          description: The caller does not belong to the workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Workspaces]
      operationId: addWorkspaceMember
      summary: Add a registered account to a workspace
      description: |
        The account has to exist already. An address without an account is
        invited instead, through the invitation endpoints.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: The created membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberResponse'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The role of the caller does not allow this change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace or the account does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The account is already a member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: userId
        in: path
        required: true
        description: The account whose membership is changed.
        schema:
          type: string
          format: uuid
    patch:
      tags: [Workspaces]
      operationId: updateWorkspaceMemberRole
      summary: Change the role of a member
      description: |
        The owner role is not part of the request: a workspace has exactly one
        owner and that role cannot be transferred.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: The updated membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberResponse'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The role of the caller does not allow this change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace or the membership does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Workspaces]
      operationId: removeWorkspaceMember
      summary: Remove a member
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The member was removed.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required: [userId, removed]
                    properties:
                      userId:
                        type: string
                        format: uuid
                      removed:
                        type: boolean
        '403':
          description: The role of the caller does not allow this change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace or the membership does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/invitations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: listWorkspaceInvitations
      summary: List the invitations of a workspace
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: The state to filter on. `ALL` returns every invitation.
          schema:
            type: string
            enum: [PENDING, ACCEPTED, REVOKED, EXPIRED, ALL]
            default: ALL
      responses:
        '200':
          description: The invitations.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
        '403':
          description: The role of the caller does not allow this read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Workspaces]
      operationId: createWorkspaceInvitation
      summary: Invite an address and send the invitation
      description: |
        The address may belong to an account or not. A pending invitation for
        the same address and workspace is refused, because the existing one can
        be resent.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: The created invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResultResponse'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The role of the caller does not allow this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The address is a member already or has a pending invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many invitations were sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [Workspaces]
      operationId: revokeWorkspaceInvitation
      summary: Revoke an invitation
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The revoked invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '403':
          description: The role of the caller does not allow this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace or the invitation does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The invitation was accepted or revoked already.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/invitations/{invitationId}/resend:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [Workspaces]
      operationId: resendWorkspaceInvitation
      summary: Send the invitation again
      description: |
        The resend issues a new token, so a link that was sent before stops
        working.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The invitation with its new deadline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResultResponse'
        '403':
          description: The role of the caller does not allow this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace or the invitation does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The invitation was accepted, revoked or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many invitations were sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invitations:
    get:
      tags: [Invitations]
      operationId: listMyInvitations
      summary: The invitations that are addressed to the signed-in account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The invitations.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invitations/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The single-use token of the invitation link.
        schema:
          type: string
    get:
      tags: [Invitations]
      operationId: getInvitation
      summary: The invitation behind the link
      description: |
        The token in the URL is the secret of the invitation, so the preview
        needs no session. The address is masked, because a forwarded mail
        carries the link with it.
      responses:
        '200':
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreviewResponse'
        '404':
          description: The token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: The invitation expired, was revoked or was accepted already.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invitations/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        description: The single-use token of the invitation link.
        schema:
          type: string
    post:
      tags: [Invitations]
      operationId: acceptInvitation
      summary: Accept the invitation and join the workspace
      description: |
        The accepting account has to be the one the invitation was meant for.
        The token works exactly once.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The accepted invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account has not verified its email address yet, or the invitation belongs to another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The invitation was accepted or revoked already.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: The invitation expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token returned by the login and refresh endpoints.
  parameters:
    CsrfHeader:
      name: x-csrf-token
      in: header
      required: false
      description: Required when the refresh token is read from the `nexus_rt` cookie. The value is returned in the login and refresh responses and in the readable `nexus_csrf` cookie.
      schema:
        type: string
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: The workspace.
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: The invitation.
      schema:
        type: string
        format: uuid
  headers:
    XRequestId:
      description: Request correlation identifier.
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [status, service, version, environment, uptimeSeconds, timestamp]
          properties:
            status:
              type: string
              const: ok
            service:
              type: string
              example: Nexus
            version:
              type: string
              example: 0.1.0
            environment:
              type: string
              enum: [development, test, production]
            uptimeSeconds:
              type: number
            timestamp:
              type: string
              format: date-time
        requestId:
          type: string
    ReadinessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [status, service, version, environment, dependencies, timestamp]
          properties:
            status:
              type: string
              enum: [ready, not_ready]
            service:
              type: string
            version:
              type: string
            environment:
              type: string
              enum: [development, test, production]
            uptimeSeconds:
              type: number
            timestamp:
              type: string
              format: date-time
            requestId:
              type: string
            dependencies:
              type: object
              required: [database, redis]
              properties:
                database:
                  $ref: '#/components/schemas/DependencyStatus'
                redis:
                  $ref: '#/components/schemas/DependencyStatus'
    DependencyStatus:
      type: object
      required: [status, latencyMs]
      properties:
        status:
          type: string
          enum: [up, down]
        latencyMs:
          type: number
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
            details:
              description: Optional structured validation details.
            requestId:
              type: string
    RegisterRequest:
      type: object
      required: [email, name, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          example: ada@example.com
        name:
          type: string
          minLength: 2
          maxLength: 100
        password:
          type: string
          description: |
            At least 8 characters, at most 128 characters and at most 72 bytes,
            with at least one letter and one number. Common passwords are
            rejected.
          minLength: 8
          maxLength: 128
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The single-use token from the emailed link.
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          description: Optional when the `nexus_rt` cookie is sent.
    PasswordResetRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
        password:
          type: string
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    EmailChangeRequest:
      type: object
      required: [email, currentPassword]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        currentPassword:
          type: string
    CurrentPasswordRequest:
      type: object
      required: [currentPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
    AccountDeleteRequest:
      type: object
      required: [currentPassword, confirmation]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
        confirmation:
          type: string
          description: The email address of the account, typed exactly.
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        bio:
          type: [string, 'null']
          maxLength: 500
        jobTitle:
          type: [string, 'null']
          maxLength: 100
        avatarUrl:
          type: [string, 'null']
          format: uri
        timeZone:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 10
    User:
      type: object
      required: [id, email, name, status, emailVerifiedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DEACTIVATED]
        emailVerifiedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    UserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'
    RegistrationResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user, verificationRequired]
          properties:
            user:
              $ref: '#/components/schemas/User'
            verificationRequired:
              type: boolean
              const: true
    CurrentUserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user]
          properties:
            user:
              type: object
              required: [id, email, name, status, emailVerified]
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                name:
                  type: string
                status:
                  type: string
                  enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DEACTIVATED]
                emailVerified:
                  type: boolean
    AuthenticationResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user, accessToken, tokenType, expiresIn, csrfToken, session]
          properties:
            user:
              $ref: '#/components/schemas/User'
            accessToken:
              type: string
              description: 'Send this in the Authorization header as a bearer token.'
            tokenType:
              type: string
              const: Bearer
            expiresIn:
              type: number
              description: The lifetime of the access token in seconds.
            csrfToken:
              type: string
              description: Send this in the `x-csrf-token` header.
            session:
              type: object
              required: [id, expiresAt]
              properties:
                id:
                  type: string
                  format: uuid
                expiresAt:
                  type: string
                  format: date-time
    MessageResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [message]
          properties:
            message:
              type: string
    Session:
      type: object
      required: [id, userAgent, ip, createdAt, lastUsedAt, expiresAt, current]
      properties:
        id:
          type: string
          format: uuid
        userAgent:
          type: [string, 'null']
        ip:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Whether this is the session of the current request.
    ProfileResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user, profile]
          properties:
            user:
              $ref: '#/components/schemas/User'
            profile:
              type: object
              required: [bio, jobTitle, avatarUrl, timeZone, locale]
              properties:
                bio:
                  type: [string, 'null']
                jobTitle:
                  type: [string, 'null']
                avatarUrl:
                  type: [string, 'null']
                timeZone:
                  type: string
                locale:
                  type: string
    WorkspaceRole:
      type: string
      enum: [OWNER, PROJECT_MANAGER, MEMBER, COLLABORATOR, VIEWER]
    AssignableRole:
      type: string
      description: The roles a caller may hand out. The owner role is not part of it.
      enum: [PROJECT_MANAGER, MEMBER, COLLABORATOR, VIEWER]
    Workspace:
      type: object
      required:
        - id
        - name
        - slug
        - status
        - ownerId
        - role
        - memberCount
        - projectCount
        - teamCount
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        ownerId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        memberCount:
          type: integer
        projectCount:
          type: integer
        teamCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkspaceResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Workspace'
    WorkspaceDeletedResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [id, deleted]
          properties:
            id:
              type: string
              format: uuid
            deleted:
              type: boolean
    WorkspaceMember:
      type: object
      required: [id, userId, name, email, status, role, joinedAt, owner]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DEACTIVATED]
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        joinedAt:
          type: string
          format: date-time
        owner:
          type: boolean
    WorkspaceMemberResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/WorkspaceMember'
    Invitation:
      type: object
      required:
        - id
        - workspaceId
        - workspaceName
        - email
        - role
        - type
        - status
        - invitedBy
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        type:
          type: string
          enum: [WORKSPACE, TEAM, PROJECT]
        status:
          type: string
          enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]
        invitedBy:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: [string, 'null']
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    InvitationResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Invitation'
    InvitationResultResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [invitation, emailSent]
          properties:
            invitation:
              $ref: '#/components/schemas/Invitation'
            emailSent:
              type: boolean
              description: False when the invitation could not be handed to the mail provider.
    InvitationPreviewResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
            - workspace
            - invitedBy
            - role
            - status
            - expiresAt
            - maskedEmail
            - boundToAccount
          properties:
            workspace:
              type: object
              required: [id, name, slug]
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                slug:
                  type: string
            invitedBy:
              type: object
              required: [id, name]
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
            role:
              $ref: '#/components/schemas/WorkspaceRole'
            status:
              type: string
              enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]
            expiresAt:
              type: string
              format: date-time
            maskedEmail:
              type: string
              example: p***@example.com
            boundToAccount:
              type: boolean
    CreateWorkspaceRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: [string, 'null']
          maxLength: 500
        slug:
          type: string
          description: The public address of the workspace. A readable slug is derived from the name when it is missing.
          minLength: 2
          maxLength: 50
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    UpdateWorkspaceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: [string, 'null']
          maxLength: 500
    AddMemberRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        role:
          allOf:
            - $ref: '#/components/schemas/AssignableRole'
          default: MEMBER
    UpdateMemberRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/AssignableRole'
    CreateInvitationRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        role:
          allOf:
            - $ref: '#/components/schemas/AssignableRole'
          default: MEMBER
    EmailWebhookResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [received, outcome]
          properties:
            received:
              type: boolean
              const: true
            outcome:
              type: string
              description: |
                How the event was handled.
                - `processed` — the event changed the delivery state.
                - `duplicate` — the event was already applied.
                - `ignored` — the event carries no known action.
                - `unmatched` — the event refers to an unknown message.
              enum: [processed, duplicate, ignored, unmatched]
