      operationId: getAiActionProposal
      summary: Read an owned AI action proposal
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Proposal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiActionProposalResponse' }
        '404': { description: Proposal does not exist for this user. }
  /ai/actions/proposals/{proposalId}/approve:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [AI]
      operationId: approveAiAction
      summary: Approve a proposed AI action
      description: The caller's permissions are re-checked. Expired proposals cannot be approved.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiActionDecisionRequest' }
      responses:
        '200':
          description: Proposal approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiActionProposalResponse' }
        '409': { description: Proposal is not pending (AI_ACTION_NOT_PENDING). }
        '410': { description: Proposal expired (AI_ACTION_EXPIRED). }
  /ai/actions/proposals/{proposalId}/reject:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [AI]
      operationId: rejectAiAction
      summary: Reject a proposed or approved AI action
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiActionDecisionRequest' }
      responses:
        '200':
          description: Proposal rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiActionProposalResponse' }
        '409': { description: Proposal cannot be rejected in its current state. }
  /ai/actions/proposals/{proposalId}/cancel:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [AI]
      operationId: cancelAiAction
      summary: Cancel a proposed or approved AI action
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Proposal cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiActionProposalResponse' }
        '409': { description: Proposal cannot be cancelled in its current state. }
  /ai/actions/proposals/{proposalId}/execute:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [AI]
      operationId: executeAiAction
      summary: Execute an approved AI action
      description: Re-checks current permissions, transitions APPROVED→EXECUTING conditionally, and executes through the owning Nexus service. The same proposal cannot execute twice.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Proposal executed with an execution result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiActionProposalResponse' }
        '409': { description: Proposal is not approved or is already executing. }
        '410': { description: Approval expired. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token returned by the login and refresh endpoints.
  parameters:
    CsrfHeader:
      name: x-csrf-token
      in: header
      required: false
      description: Required when the refresh token is read from the `nexus_rt` cookie. The value is returned in the login and refresh responses and in the readable `nexus_csrf` cookie.
      schema:
        type: string
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: The workspace.
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      description: The workspace team.
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      description: The workspace project.
      schema:
        type: string
        format: uuid
    TeamUserId:
      name: userId
      in: path
      required: true
      description: The workspace user whose team membership is targeted.
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: The invitation.
      schema:
        type: string
        format: uuid
    JoinRequestId:
      name: requestId
      in: path
      required: true
      description: The join request.
      schema:
        type: string
        format: uuid
  headers:
    XRequestId:
      description: Request correlation identifier.
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [status, service, version, environment, uptimeSeconds, timestamp]
          properties:
            status:
              type: string
              const: ok
            service:
              type: string
              example: Nexus
            version:
              type: string
              example: 0.1.0
            environment:
              type: string
              enum: [development, test, production]
            uptimeSeconds:
              type: number
            timestamp:
              type: string
              format: date-time
        requestId:
          type: string
    ReadinessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [status, service, version, environment, dependencies, timestamp]
          properties:
            status:
              type: string
              enum: [ready, not_ready]
            service:
              type: string
            version:
              type: string
            environment:
              type: string
              enum: [development, test, production]
            uptimeSeconds:
              type: number
            timestamp:
              type: string
              format: date-time
            requestId:
              type: string
            dependencies:
              type: object
              required: [database, redis]
              properties:
                database:
                  $ref: '#/components/schemas/DependencyStatus'
                redis:
                  $ref: '#/components/schemas/DependencyStatus'
    DependencyStatus:
      type: object
      required: [status, latencyMs]
      properties:
        status:
          type: string
          enum: [up, down]
        latencyMs:
          type: number
    WorkerHealthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [status, service, workers, queues, checkedAt, staleAfterMs, timestamp]
          properties:
            status:
              type: string
              enum: [ok, degraded]
            service:
              type: string
            version:
              type: string
            environment:
              type: string
              enum: [development, test, production]
            uptimeSeconds:
              type: number
            timestamp:
              type: string
              format: date-time
            checkedAt:
              type: string
              format: date-time
            staleAfterMs:
              type: integer
              minimum: 0
            requestId:
              type: string
            workers:
              type: array
              items:
                $ref: '#/components/schemas/WorkerHealthEntry'
            queues:
              type: array
              items:
                $ref: '#/components/schemas/QueueStatus'
    WorkerHealthEntry:
      type: object
      required:
        - name
        - state
        - started
        - stale
        - consecutiveFailures
        - lastPassStartedAt
        - lastSuccessAt
        - lastFailureAt
        - lastErrorCode
      properties:
        name:
          type: string
          example: email
        state:
          type: string
          enum: [IDLE, RUNNING, FAILING, STOPPED]
        started:
          type: boolean
        stale:
          type: boolean
        consecutiveFailures:
          type: integer
          minimum: 0
        lastPassStartedAt:
          type: string
          format: date-time
          nullable: true
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
        lastFailureAt:
          type: string
          format: date-time
          nullable: true
        lastErrorCode:
          type: string
          nullable: true
          description: A stable error code. Raw messages are never returned.
    QueueStatus:
      type: object
      required: [name, pending, failed]
      properties:
        name:
          type: string
          example: email
        pending:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
            details:
              description: Optional structured validation details.
            requestId:
              type: string
    RegisterRequest:
      type: object
      required: [email, name, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          example: ada@example.com
        name:
          type: string
          minLength: 2
          maxLength: 100
        password:
          type: string
          description: |
            At least 8 characters, at most 128 characters and at most 72 bytes,
            with at least one letter and one number. Common passwords are
            rejected.
          minLength: 8
          maxLength: 128
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The single-use token from the emailed link.
    EmailCodeRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\\d{6}$'
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          description: Optional when the `nexus_rt` cookie is sent.
    PasswordResetRequest:
      type: object
      required: [email, code, newPassword]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\\d{6}$'
        newPassword:
          type: string
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    EmailChangeRequest:
      type: object
      required: [email, currentPassword]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        currentPassword:
          type: string
    CurrentPasswordRequest:
      type: object
      required: [currentPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
    AccountDeleteRequest:
      type: object
      required: [currentPassword, confirmation]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
        confirmation:
          type: string
          description: The email address of the account, typed exactly.
    AccountDeletionScheduledResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [status, scheduledDeletionAt]
          properties:
            status:
              type: string
              const: PENDING_DELETION
            scheduledDeletionAt:
              type: string
              format: date-time
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        bio:
          type: [string, 'null']
          maxLength: 500
        jobTitle:
          type: [string, 'null']
          maxLength: 100
        timeZone:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 10
    User:
      type: object
      required: [id, email, name, status, emailVerifiedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DEACTIVATED, PENDING_DELETION]
        emailVerifiedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    UserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'
    RegistrationResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user, verificationRequired]
          properties:
            user:
              $ref: '#/components/schemas/User'
            verificationRequired:
              type: boolean
              const: true
    CurrentUserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user]
          properties:
            user:
              type: object
              required: [id, email, name, status, emailVerified]
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                name:
                  type: string
                status:
                  type: string
                  enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DEACTIVATED, PENDING_DELETION]
                emailVerified:
                  type: boolean
    AuthenticationResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user, accessToken, tokenType, expiresIn, csrfToken, session]
          properties:
            user:
              $ref: '#/components/schemas/User'
            accessToken:
              type: string
              description: 'Send this in the Authorization header as a bearer token.'
            tokenType:
              type: string
              const: Bearer
            expiresIn:
              type: number
              description: The lifetime of the access token in seconds.
            csrfToken:
              type: string
              description: Send this in the `x-csrf-token` header.
            session:
              type: object
              required: [id, expiresAt]
              properties:
                id:
                  type: string
                  format: uuid
                expiresAt:
                  type: string
                  format: date-time
    LoginResponse:
      oneOf:
        - $ref: '#/components/schemas/AuthenticationResponse'
        - $ref: '#/components/schemas/MfaChallengeResponse'
    MfaChallengeResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [twoFactorRequired, challengeToken, expiresIn]
          properties:
            twoFactorRequired: { type: boolean, const: true }
            challengeToken: { type: string, description: Short-lived token accepted only by `/auth/2fa/challenge`. }
            expiresIn: { type: integer, const: 300 }
    TwoFactorChallengeRequest:
      type: object
      additionalProperties: false
      required: [challengeToken]
      properties:
        challengeToken: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
        recoveryCode: { type: string, minLength: 8, maxLength: 32 }
      oneOf:
        - required: [code]
        - required: [recoveryCode]
    TwoFactorCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    TwoFactorDisableRequest:
      type: object
      additionalProperties: false
      required: [currentPassword]
      properties:
        currentPassword: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
        recoveryCode: { type: string, minLength: 8, maxLength: 32 }
      oneOf:
        - required: [code]
        - required: [recoveryCode]
    RecoveryCodeRegenerateRequest:
      type: object
      additionalProperties: false
      properties:
        currentPassword: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
        recoveryCode: { type: string, minLength: 8, maxLength: 32 }
      oneOf:
        - required: [currentPassword]
        - required: [code]
        - required: [recoveryCode]
    TwoFactorSetupResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [otpauthUrl, expiresIn]
          properties:
            otpauthUrl: { type: string, format: uri, description: Secret-bearing URI; show only to the signed-in account owner. }
            expiresIn: { type: integer, const: 600 }
    RecoveryCodesResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [recoveryCodes]
          properties:
            recoveryCodes:
              type: array
              minItems: 10
              maxItems: 10
              items: { type: string, pattern: '^[A-F0-9]{32}$' }
    MessageResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [message]
          properties:
            message:
              type: string
    Session:
      type: object
      required: [id, userAgent, ip, createdAt, lastUsedAt, expiresAt, current]
      properties:
        id:
          type: string
          format: uuid
        userAgent:
          type: [string, 'null']
        ip:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Whether this is the session of the current request.
    ProfileResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user, profile]
          properties:
            user:
              $ref: '#/components/schemas/User'
            profile:
              type: object
              required: [bio, jobTitle, avatarUrl, timeZone, locale]
              properties:
                bio:
                  type: [string, 'null']
                jobTitle:
                  type: [string, 'null']
                avatarUrl:
                  type: [string, 'null']
                timeZone:
                  type: string
                locale:
                  type: string
    WorkspaceRole:
      type: string
      enum: [OWNER, PROJECT_MANAGER, MEMBER, COLLABORATOR, VIEWER]
    OrganizationRole:
      type: string
      description: Workspace-scoped predefined Company or Institution role. Custom roles are deferred.
      enum:
        - COMPANY_OWNER
        - COMPANY_ADMIN
        - COMPANY_PROJECT_MANAGER
        - COMPANY_MEMBER
        - COMPANY_COLLABORATOR
        - COMPANY_VIEWER
        - INSTITUTION_OWNER
        - INSTITUTION_ADMIN
        - INSTITUTION_DEPARTMENT_HEAD
        - INSTITUTION_LECTURER_STAFF
        - INSTITUTION_STUDENT
        - INSTITUTION_COLLABORATOR
        - INSTITUTION_VIEWER
    WorkspaceType:
      type: string
      enum: [INDIVIDUAL, COMPANY, INSTITUTION]
    WorkspaceStatus:
      type: string
      enum: [ACTIVE, ARCHIVED, SUSPENDED]
    WorkspaceVisibility:
      type: string
      enum: [PRIVATE, PUBLIC]
    AssignableRole:
      type: string
      description: The roles a caller may hand out. The owner role is not part of it.
      enum: [PROJECT_MANAGER, MEMBER, COLLABORATOR, VIEWER]
    Workspace:
      type: object
      required:
        - id
        - name
        - slug
        - type
        - isPersonal
        - visibility
        - status
        - ownerId
        - role
        - organizationRole
        - joinCodeEnabled
        - memberCount
        - projectCount
        - teamCount
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        type:
          $ref: '#/components/schemas/WorkspaceType'
        isPersonal:
          type: boolean
          description: Server-managed marker for the account's protected personal workspace.
        visibility:
          $ref: '#/components/schemas/WorkspaceVisibility'
        status:
          $ref: '#/components/schemas/WorkspaceStatus'
        ownerId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        organizationRole:
          oneOf:
            - $ref: '#/components/schemas/OrganizationRole'
            - type: 'null'
        joinCodeEnabled:
          type: boolean
          description: Indicates whether a join code exists. The code itself is never included in workspace responses.
        memberCount:
          type: integer
        projectCount:
          type: integer
        teamCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkspaceResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Workspace'
    OwnershipTransferInitiationResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [transferId, status]
          properties:
            transferId: { type: string, format: uuid }
            status: { type: string, const: PENDING }
    OwnershipTransferDecisionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [workspaceId, status]
          properties:
            workspaceId: { type: string, format: uuid }
            status: { type: string, const: REJECTED }
    IncomingOwnershipTransfersResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items, limit, offset]
          properties:
            items:
              type: array
              items:
                type: object
                required: [id, workspaceId, status, createdAt, expiresAt, acceptedAt, billingAcceptedAt, workspace, initiatedBy]
                properties:
                  id: { type: string, format: uuid }
                  workspaceId: { type: string, format: uuid }
                  status: { type: string, const: PENDING }
                  createdAt: { type: string, format: date-time }
                  expiresAt: { type: [string, 'null'], format: date-time }
                  acceptedAt: { type: [string, 'null'], format: date-time }
                  billingAcceptedAt: { type: [string, 'null'], format: date-time }
                  workspace:
                    type: object
                    required: [id, name, type, status]
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      type: { $ref: '#/components/schemas/WorkspaceType' }
                      status: { $ref: '#/components/schemas/WorkspaceStatus' }
                  initiatedBy:
                    type: object
                    description: Sender identity — the current owner who initiated the transfer.
                    required: [id, name]
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
            limit: { type: integer }
            offset: { type: integer }
    PrivacyRequestType:
      type: string
      enum: [ACCESS, CORRECTION, ERASURE, REDACTION]
    PrivacyRequestStatus:
      type: string
      enum: [SUBMITTED, IN_REVIEW, APPROVED, REJECTED, COMPLETED]
    CreatePrivacyRequest:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { $ref: '#/components/schemas/PrivacyRequestType' }
        description: { type: string, minLength: 1, maxLength: 2000 }
        targetType: { type: string, const: COMMENT }
        targetId: { type: string, format: uuid }
    PrivacyRequest:
      type: object
      required: [id, userId, type, status, description, targetType, targetId, reviewedById, decisionNote, outcome, decidedAt, completedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/PrivacyRequestType' }
        status: { $ref: '#/components/schemas/PrivacyRequestStatus' }
        description: { type: [string, 'null'] }
        targetType: { type: [string, 'null'] }
        targetId: { type: [string, 'null'], format: uuid }
        reviewedById: { type: [string, 'null'], format: uuid }
        decisionNote: { type: [string, 'null'] }
        outcome: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PrivacyRequestResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/PrivacyRequest' }
    PrivacyRequestListResponse:
      type: object
      required: [success, data]
      properties:
