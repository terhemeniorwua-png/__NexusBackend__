openapi: 3.1.0
info:
  title: Nexus Backend API
  version: 0.1.0
  description: |
    Nexus workspace and project management backend.

    Phase 1 provides the foundation (health, configuration, error contract).
    Phase 3 adds the account lifecycle: registration, email verification,
    sessions, password recovery, Google OpenID Connect, server-managed profile
    images and optional TOTP two-factor authentication.
    The backend provides a signed transactional email provider webhook.
    Workspace routes support workspace types, memberships, invitations,
    public discovery, join codes, join requests and membership
    suspension/restoration.

    Authentication model:
    - The access token is a short-lived JWT returned in the response body and
      sent in the `Authorization: Bearer <token>` header. It is never stored
      in a cookie, so business endpoints are not vulnerable to CSRF.
    - The refresh token is an opaque random value delivered in the httpOnly
      `nexus_rt` cookie. Only its SHA-256 digest is stored in PostgreSQL.
    - The refresh token rotates on every use. Presenting a rotated token
      revokes every session of the account.
    - Requests that rely on the `nexus_rt` cookie must also send the CSRF
      token in the `x-csrf-token` header. The `nexus_csrf` cookie alone is
      not accepted, because a browser attaches cookies to cross-site requests
      automatically.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development server
tags:
  - name: Health
    description: Application liveness and dependency readiness
  - name: Authentication
    description: Account registration, verification, sessions and recovery
  - name: Users
    description: The signed-in user's own profile
  - name: Webhooks
    description: Email provider callbacks, authenticated by HMAC signature
  - name: Workspaces
    description: Workspaces, memberships, discovery, join requests and invitations
  - name: Invitations
    description: Invitation links, their preview and their acceptance
  - name: Teams
    description: Workspace-scoped teams and team membership
  - name: Projects
    description: Workspace-scoped projects, visibility, project membership, activity, and milestones
  - name: Billing
    description: Workspace subscription and payment management
  - name: Integrations
    description: Personal and workspace integration connections
  - name: Search
    description: Unified permission-filtered global search
  - name: Outbound webhooks
    description: Workspace webhook subscriptions and durable deliveries
paths:
  /search:
    get:
      tags: [Search]
      operationId: globalSearch
      summary: Search authorised workspace content
      description: Searches people, workspaces, teams, departments, projects, tasks, messages, conversations, files, documents, meetings, and channels across workspaces the caller can access. Results are filtered by current permissions. `data` is an array and pagination metadata is returned in `meta`.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [all, people, workspaces, teams, departments, projects, tasks, messages, conversations, files, documents, meetings, channels, announcements]
            default: all
        - name: workspaceId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [relevance, recent], default: relevance }
      responses:
        '200':
          description: Permission-filtered results with pagination metadata.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SearchResult' }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      limit: { type: integer }
                      hasMore: { type: boolean }
                      category: { type: string }
        '401': { description: Authentication is required. }
  /search/suggestions:
    get:
      tags: [Search]
      operationId: searchSuggestions
      summary: Return lightweight search suggestions
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: workspaceId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Up to eight ranked suggestions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SearchSuggestion' }
        '401': { description: Authentication is required. }
  /search/recent:
    get:
      tags: [Search]
      operationId: listRecentSearches
      summary: List the caller's recent searches
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The caller's recent search history. History is private to the caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RecentSearch' }
        '401': { description: Authentication is required. }
    delete:
      tags: [Search]
      operationId: clearRecentSearches
      summary: Clear the caller's recent searches
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Number of cleared history entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      deleted: { type: integer }
        '401': { description: Authentication is required. }
  /integrations:
    get:
      tags: [Integrations]
      operationId: listIntegrations
      summary: List integrations visible to the caller
      description: Without workspaceId, returns the caller's personal connections. With workspaceId, also returns workspace connections visible to that caller. Disconnected integrations are omitted.
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Visible integration connections. Tokens are never returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationListResponse' }
        '401': { description: Authentication is required. }
        '404': { description: Workspace is unavailable to the caller. }
    post:
      tags: [Integrations]
      operationId: createIntegrationConnection
      summary: Save a connection for a provider without a dedicated OAuth flow
      description: Slack, Google Drive, Dropbox, and Gmail must use their dedicated OAuth endpoints. Tokens are encrypted before persistence and never returned.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIntegrationRequest' }
      responses:
        '201':
          description: Integration connection saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationResponse' }
        '400': { description: Invalid request or a dedicated OAuth flow is required. }
        '401': { description: Authentication is required. }
        '404': { description: Workspace is unavailable to the caller. }
  /integrations/{integrationId}:
    patch:
      tags: [Integrations]
      operationId: updateIntegration
      summary: Enable or disable an integration
      description: Personal connections can be changed only by their owner. Workspace connections require workspace update permission. Disabling pauses sync without deleting the connection.
      security:
        - bearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              additionalProperties: false
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated integration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationResponse' }
        '401': { description: Authentication is required. }
        '404': { description: Integration is unavailable to the caller. }
        '409': { description: A disconnected integration cannot be re-enabled without reconnecting. }
    delete:
      tags: [Integrations]
      operationId: disconnectIntegration
      summary: Disconnect an integration
      description: Personal connections can be disconnected only by their owner. Workspace Slack connections require workspace update permission. The provider token is revoked when the provider supports revocation; provider-side data is never deleted.
      security:
        - bearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Integration marked disconnected.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                      providerRevoked: { type: boolean }
        '401': { description: Authentication is required. }
        '404': { description: Integration is unavailable to the caller. }
  /integrations/{integrationId}/refresh:
    post:
      tags: [Integrations]
      operationId: refreshIntegration
      summary: Refresh an integration access token
      description: Uses the provider refresh flow when one exists and records lastRefreshedAt. A provider failure marks the integration ERROR and returns the provider error.
      security:
        - bearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Refreshed integration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationResponse' }
        '400': { description: The provider has no refresh flow or the connection has no refresh token. }
        '401': { description: Authentication is required. }
        '404': { description: Integration is unavailable to the caller. }
        '409': { description: The integration is disconnected. }
        '502': { description: The provider rejected the refresh. }
  /integrations/{integrationId}/sync:
    post:
      tags: [Integrations]
      operationId: queueIntegrationSync
      summary: Queue a durable sync job
      description: Creates a PostgreSQL-backed IntegrationSyncJob. The sync worker processes it asynchronously and retries provider failures with bounded backoff.
      security:
        - bearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Sync job queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationSyncJobResponse' }
        '401': { description: Authentication is required. }
        '404': { description: Integration is unavailable to the caller. }
        '409': { description: The integration is disabled or disconnected. }
  /integrations/{integrationId}/sync-jobs:
    get:
      tags: [Integrations]
      operationId: listIntegrationSyncJobs
      summary: List sync job history
      security:
        - bearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Sync job history, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/IntegrationSyncJob' }
        '401': { description: Authentication is required. }
        '404': { description: Integration is unavailable to the caller. }
  /integrations/{integrationId}/sync-jobs/{jobId}/retry:
    post:
      tags: [Integrations]
      operationId: retryIntegrationSyncJob
      summary: Retry a failed sync job
      description: Resets a failed or completed sync job to PENDING with zero attempts. A running job returns 409.
      security:
        - bearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sync job reset to pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationSyncJobResponse' }
        '401': { description: Authentication is required. }
        '404': { description: Integration or sync job is unavailable to the caller. }
        '409': { description: The sync job is already running. }
  /integrations/gmail/authorize:
    get:
      tags: [Integrations]
      operationId: authorizeGmail
      summary: Start a personal Gmail OAuth flow
      description: workspaceId is accepted for frontend compatibility but ignored; the resulting connection belongs only to the signed-in user.
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Google consent URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GmailAuthorizeResponse' }
        '401': { description: Authentication is required. }
        '503': { description: Gmail OAuth is not configured. }
  /integrations/gmail/callback:
    get:
      tags: [Integrations]
      operationId: gmailOAuthCallback
      summary: Complete a personal Gmail OAuth flow
      description: Public Google redirect endpoint. Valid state and code are required to save the caller-bound personal connection. Redirects to the frontend integrations page with a status; tokens are not returned.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string, maxLength: 2000 }
        - name: state
          in: query
          required: true
          schema: { type: string, maxLength: 2000 }
        - name: error
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
      responses:
        '302': { description: Redirect to the configured frontend with connected, denied, or error status. }
  /integrations/google-drive/authorize:
    get:
      tags: [Integrations]
      operationId: authorizeGoogleDrive
      summary: Start a workspace Google Drive OAuth flow
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Google consent URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GmailAuthorizeResponse' }
        '401': { description: Authentication is required. }
        '404': { description: Workspace is unavailable to the caller. }
  /integrations/google-drive/callback:
    get:
      tags: [Integrations]
      operationId: googleDriveOAuthCallback
      summary: Complete a workspace Google Drive OAuth flow
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 2000 } }
        - { name: state, in: query, required: true, schema: { type: string, maxLength: 2000 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        '302': { description: Redirect to the configured frontend with connected, denied, or error status. }
  /integrations/dropbox/authorize:
    get:
      tags: [Integrations]
      operationId: authorizeDropbox
      summary: Start a workspace Dropbox OAuth flow
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Dropbox consent URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GmailAuthorizeResponse' }
        '401': { description: Authentication is required. }
        '404': { description: Workspace is unavailable to the caller. }
  /integrations/dropbox/callback:
    get:
      tags: [Integrations]
      operationId: dropboxOAuthCallback
      summary: Complete a workspace Dropbox OAuth flow
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 2000 } }
        - { name: state, in: query, required: true, schema: { type: string, maxLength: 2000 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        '302': { description: Redirect to the configured frontend with connected, denied, or error status. }
  /integrations/slack/authorize:
    get:
      tags: [Integrations]
      operationId: authorizeSlack
      summary: Start a workspace Slack OAuth flow
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Slack consent or configured default-connect URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GmailAuthorizeResponse' }
        '401': { description: Authentication is required. }
        '404': { description: Workspace is unavailable to the caller. }
  /integrations/slack/callback:
    get:
      tags: [Integrations]
      operationId: slackOAuthCallback
      summary: Complete a workspace Slack OAuth flow
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 500 } }
        - { name: state, in: query, required: true, schema: { type: string, maxLength: 2000 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        '302': { description: Redirect to the configured frontend with connected, denied, or error status. }
  /integrations/slack/default-callback:
    get:
      tags: [Integrations]
      operationId: slackDefaultConnectCallback
      summary: Complete the optional workspace Slack default-connect flow
      description: Available only when SLACK_DEFAULT_CONNECT=true and SLACK_BOT_TOKEN is configured.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string, maxLength: 2000 }
      responses:
        '302': { description: Redirect to the configured frontend with connected or error status. }

  /workspaces/{workspaceId}/webhooks:
    get:
      tags: [Outbound webhooks]
      operationId: listWebhooks
      summary: List workspace webhook subscriptions
      description: Any active workspace member may list subscriptions. Signing secrets are never returned.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace webhook subscriptions.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookSubscription' }
        '401': { description: Authentication is required. }
        '403': { description: The caller is not an active workspace member. }
        '404': { description: Workspace is unavailable to the caller. }
    post:
      tags: [Outbound webhooks]
      operationId: createWebhook
      summary: Create a workspace webhook subscription
      description: Requires workspace update permission. The signing secret is returned once, either as generated or as supplied.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWebhookRequest' }
      responses:
        '201':
          description: Subscription created. The plaintext signing secret is included once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscriptionWithSecretResponse' }
        '400': { description: Invalid URL, events, or request body. }
        '401': { description: Authentication is required. }
        '403': { description: The caller lacks workspace update permission. }
  /workspaces/{workspaceId}/webhooks/{webhookId}:
    patch:
      tags: [Outbound webhooks]
      operationId: updateWebhook
      summary: Update a workspace webhook subscription
      description: Requires workspace update permission. Supplying secret rotates the signing secret and returns it once.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: webhookId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWebhookRequest' }
      responses:
        '200':
          description: Updated subscription. The plaintext secret is included only when rotated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscriptionWithSecretResponse' }
        '400': { description: Invalid URL, events, or request body. }
        '401': { description: Authentication is required. }
        '403': { description: The caller lacks workspace update permission. }
        '404': { description: Webhook is unavailable to the caller. }
    delete:
      tags: [Outbound webhooks]
      operationId: deleteWebhook
      summary: Delete a workspace webhook subscription
      description: Requires workspace update permission. Delivery history is deleted with the subscription.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: webhookId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Subscription deleted. }
        '401': { description: Authentication is required. }
        '403': { description: The caller lacks workspace update permission. }
        '404': { description: Webhook is unavailable to the caller. }
  /workspaces/{workspaceId}/webhooks/{webhookId}/deliveries:
    get:
      tags: [Outbound webhooks]
      operationId: listWebhookDeliveries
      summary: List webhook delivery attempts
      description: Any active workspace member may inspect delivery history.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: webhookId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Delivery history, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDelivery' }
        '401': { description: Authentication is required. }
        '403': { description: The caller is not an active workspace member. }
        '404': { description: Webhook is unavailable to the caller. }
  /workspaces/{workspaceId}/webhooks/{webhookId}/deliveries/{deliveryId}/retry:
    post:
      tags: [Outbound webhooks]
      operationId: retryWebhookDelivery
      summary: Retry a webhook delivery
      description: Requires workspace update permission. Resets a failed or completed delivery to PENDING with zero attempts.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: webhookId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: deliveryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Delivery reset to pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDeliveryResponse' }
        '401': { description: Authentication is required. }
        '403': { description: The caller lacks workspace update permission. }
        '404': { description: Webhook or delivery is unavailable to the caller. }
        '409': { description: The delivery is already running. }

  /billing/plans:
    get:
      tags: [Billing]
      operationId: listBillingPlans
      summary: List the available billing plans
      description: Returns the server-owned USD plan prices and included/additional seat pricing.
      security: []
      responses:
        '200':
          description: Available billing plans.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPlansResponse'
  /billing/workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Billing]
      operationId: getWorkspaceBilling
      summary: Read workspace subscription and seat summary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription, seat count, pending change, and renewal summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBillingResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace is unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /billing/workspaces/{workspaceId}/payments:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Billing]
      operationId: listWorkspaceBillingPayments
      summary: List recent workspace payments
      description: Returns at most the 50 most recent payment records for workspace members.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recent billing payments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPaymentsResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace is unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /billing/workspaces/{workspaceId}/checkout:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Billing]
      operationId: createBillingCheckout
      summary: Start hosted checkout for a plan
      description: Only the workspace owner can start checkout. The backend calculates price and billable seats; a returned provider URL does not itself activate paid access.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingTargetRequest'
      responses:
        '201':
          description: Hosted checkout URL and server-generated transaction reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCheckoutResponse'
        '400':
          description: Invalid billing target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Workspace owner access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A checkout or billing state conflict prevents a new checkout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Billing request rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: USD billing is not configured or enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /billing/workspaces/{workspaceId}/verify:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Billing]
      operationId: verifyBillingCheckout
      summary: Verify and fulfill a checkout
      description: The workspace owner submits the server-generated reference. The backend verifies transaction status, amount, and currency with Paystack before updating subscription state.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingVerifyRequest'
      responses:
        '200':
          description: Current subscription and seat summary after verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBillingResponse'
        '402':
          description: Provider verification did not confirm the expected payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Workspace owner access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Verification is processing or requires reconciliation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Billing request rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /billing/workspaces/{workspaceId}/change:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Billing]
      operationId: scheduleBillingChange
      summary: Schedule a plan downgrade or seat reduction
      description: Lower-cost changes are scheduled for the current period end. Upgrades and seat increases require a verified checkout.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingTargetRequest'
      responses:
        '200':
          description: Scheduled plan change and effective date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingChangeResponse'
        '403':
          description: Workspace owner access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Subscription state does not permit the requested schedule change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Billing request rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /billing/workspaces/{workspaceId}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Billing]
      operationId: cancelWorkspaceBilling
      summary: Cancel renewal at the end of the paid period
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cancellation state and effective date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCancellationResponse'
        '403':
          description: Workspace owner access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No paid subscription was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Billing request rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/discover:
    get:
      tags: [Workspaces]
      operationId: discoverWorkspaces
      summary: Discover public workspaces
      description: Returns public, active workspaces matching the optional search term. Membership is still granted only through an invitation or an approved join request.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Public workspace results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredWorkspacesResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/join:
    post:
      tags: [Workspaces]
      operationId: requestWorkspaceJoinByCode
      summary: Request to join a workspace using a join code
      description: Creates a pending join request. The code is only returned when an authorized workspace administrator creates or rotates it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinByCodeRequest'
      responses:
        '201':
          description: The pending join request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestResponse'
        '400':
          description: The request body or join code is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account cannot request membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The join code is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The account already belongs to the workspace or has a pending request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many join requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/join-requests/mine:
    get:
      tags: [Workspaces]
      operationId: listMyJoinRequests
      summary: List the signed-in account's join requests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The account's join requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestsResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/join-requests/{requestId}:
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Workspaces]
      operationId: withdrawJoinRequest
      summary: Withdraw a pending join request
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The withdrawn request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestResponse'
        '403':
          description: The request does not belong to the signed-in account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The request does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The request is no longer pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/join-requests:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: listWorkspaceJoinRequests
      summary: List join requests for a workspace
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, WITHDRAWN, EXPIRED, ALL]
            default: ALL
      responses:
        '200':
          description: The workspace join requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestsResponse'
        '403':
          description: The caller cannot review join requests for this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Workspaces]
      operationId: createWorkspaceJoinRequest
      summary: Request to join a workspace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJoinRequestRequest'
      responses:
        '201':
          description: The pending join request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestResponse'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account cannot request membership or the workspace is not publicly discoverable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The account already belongs to the workspace or has a pending request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many join requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/join-requests/{requestId}/approve:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/JoinRequestId'
    post:
      tags: [Workspaces]
      operationId: approveWorkspaceJoinRequest
      summary: Approve a join request and create membership
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveJoinRequestRequest'
      responses:
        '200':
          description: The approved request and resulting membership information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestResponse'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller cannot approve join requests for this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace or request does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The request is no longer pending or membership already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/join-requests/{requestId}/reject:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/JoinRequestId'
    post:
      tags: [Workspaces]
      operationId: rejectWorkspaceJoinRequest
      summary: Reject a join request
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectJoinRequestRequest'
      responses:
        '200':
          description: The rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestResponse'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller cannot reject join requests for this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace or request does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The request is no longer pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/join-code:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: rotateWorkspaceJoinCode
      summary: Create or rotate a workspace join code
      description: The plaintext code is returned only by this operation. Store it securely; later workspace responses expose only whether a code is enabled.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: The new join code and join link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinCodeResponse'
        '403':
          description: The caller cannot manage join codes for this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Workspaces]
      operationId: disableWorkspaceJoinCode
      summary: Disable the workspace join code
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The join code was disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinCodeDisabledResponse'
        '403':
          description: The caller cannot manage join codes for this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/members/{userId}/suspend:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Workspaces]
      operationId: suspendWorkspaceMember
      summary: Suspend a member's workspace access
      description: Suspended members remain associated with their Nexus account but cannot use this workspace until restored.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The updated membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberResponse'
        '403':
          description: The caller cannot suspend this member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace or membership does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The operation is not valid for the current membership state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/members/{userId}/restore:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Workspaces]
      operationId: restoreWorkspaceMember
      summary: Restore a suspended member's workspace access
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The restored membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberResponse'
        '403':
          description: The caller cannot restore this member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The workspace or membership does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The membership is not suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Application liveness
      description: Returns 200 when the HTTP process is running.
      security: []
      responses:
        '200':
          description: The application process is alive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/live:
    get:
      tags: [Health]
      operationId: getLivenessAlias
      summary: Application liveness
      security: []
      responses:
        '200':
          description: The application process is alive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Dependency readiness
      description: Checks PostgreSQL and Redis with configured timeouts.
      security: []
      responses:
        '200':
          description: All required dependencies are available.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: One or more required dependencies are unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /health/workers:
    get:
      tags: [Health]
      operationId: getWorkerHealth
      summary: Background worker and durable queue health
      description: |
        Reports process-local worker liveness and PostgreSQL-backed queue depth.
        Returns 503 when a worker is failing or stale. The response never
        includes job payloads, recipient addresses or raw error messages.
      security: []
      responses:
        '200':
          description: Background processing is healthy.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerHealthResponse'
        '503':
          description: A worker is failing or has not completed a pass recently.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerHealthResponse'
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Create an account
      security: []
      description: |
        Creates a `PENDING_VERIFICATION` account and sends a verification link.
        The password is never echoed back and is never included in an email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account was created and is waiting for verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An account with this email address already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many accounts were created from this address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/verify-email:
    post:
      tags: [Authentication]
      operationId: verifyEmail
      summary: Deprecated link verification endpoint (410)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Legacy link verification is disabled; use /auth/email/verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: The token is invalid, expired or has already been used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/resend-verification:
    post:
      tags: [Authentication]
      operationId: resendVerification
      summary: Deprecated link resend endpoint (410)
      security: []
      description: The response is identical whether or not the address is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Legacy link resend is disabled; use /auth/email/resend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /auth/email/verify:
    post:
      tags: [Authentication]
      operationId: verifyEmailCode
      summary: Verify an account with a six-digit code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
      responses:
        '200':
          description: The account is active. This endpoint does not issue a session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid/expired code or too many attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/email/resend:
    post:
      tags: [Authentication]
      operationId: resendVerificationCode
      summary: Request a verification code
      security: []
      description: The generic response does not reveal whether an account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Generic success response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: A session was created when 2FA is disabled; otherwise a five-minute 2FA challenge is returned without session cookies.
          headers:
            Set-Cookie:
              description: Set only when a normal session is issued.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: The email address or password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account is suspended or deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many sign-in attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/google:
    get:
      tags: [Authentication]
      operationId: initiateGoogleLogin
      summary: Redirect to Google OpenID Connect
      security: []
      responses:
        '302':
          description: Sets a short-lived HttpOnly browser-binding cookie and redirects to Google with state and nonce.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              schema: { type: string }
        '429':
          description: Too many sign-in attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/google/callback:
    get:
      tags: [Authentication]
      operationId: googleLoginCallback
      summary: Validate Google's callback and redirect to the frontend
      security: []
      parameters:
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
        - in: query
          name: error
          schema:
            type: string
      responses:
        '302':
          description: Requires the matching browser-binding cookie and single-use state. Redirects to the fixed configured frontend callback with a short-lived exchange code, or with a stable generic error code (including when code or state is missing).
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              schema: { type: string }
        '429':
          description: Too many Google sign-in attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/google/exchange:
    post:
      tags: [Authentication]
      operationId: exchangeGoogleLoginCode
      summary: Exchange a one-time Google login code for a Nexus session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 32
                  maxLength: 256
      responses:
        '200':
          description: The normal login response; 2FA challenge is returned when enabled. Session cookies are set when login is complete.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: The code is invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The verified email belongs to an unlinked Nexus account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/2fa/challenge:
    post:
      tags: [Authentication]
      operationId: completeTwoFactorLogin
      summary: Complete a two-factor login challenge
      security: []
      description: The challenge expires in five minutes, is single-use, and is not a bearer access token. Supply exactly one TOTP or recovery code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorChallengeRequest'
      responses:
        '200':
          description: A normal session was issued.
          headers:
            Set-Cookie:
              description: The `nexus_rt` and `nexus_csrf` cookies.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '401': { description: Invalid, expired, reused challenge or verification code. }
        '429': { description: IP/account MFA lockout or request rate limit. }
  /auth/2fa/setup:
    post:
      tags: [Authentication]
      operationId: beginTwoFactorSetup
      summary: Begin TOTP enrollment
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Enrollment URI; valid for ten minutes and should be shown only to the account owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorSetupResponse'
        '401': { description: Authentication is required. }
        '409': { description: Two-factor authentication is already enabled. }
  /auth/2fa/confirm:
    post:
      tags: [Authentication]
      operationId: confirmTwoFactorSetup
      summary: Confirm TOTP enrollment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCodeRequest'
      responses:
        '200':
          description: Two-factor authentication enabled. Recovery codes are returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResponse'
        '401': { description: Invalid code or enrollment expired. }
        '409': { description: Setup has not begun or two-factor authentication is already enabled. }
  /auth/2fa/disable:
    post:
      tags: [Authentication]
      operationId: disableTwoFactor
      summary: Disable TOTP two-factor authentication
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorDisableRequest'
      responses:
        '200': { description: Two-factor authentication disabled; recovery codes and secret removed. }
        '401': { description: Password or verification code is invalid. }
        '409': { description: Two-factor authentication is not enabled. }
  /auth/2fa/recovery-codes:
    post:
      tags: [Authentication]
      operationId: regenerateTwoFactorRecoveryCodes
      summary: Replace recovery codes
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodeRegenerateRequest'
      responses:
        '200':
          description: New recovery codes, returned once; previous codes are invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResponse'
        '401': { description: Password or verification code is invalid. }
        '409': { description: Two-factor authentication is not enabled. }
  /auth/reactivate:
    post:
      tags: [Authentication]
      operationId: reactivateAccount
      summary: Reactivate an account or cancel scheduled deletion
      security: []
      description: |
        Self-service reactivation is available for a `DEACTIVATED` account or
        to cancel a `PENDING_DELETION` account before its 30-day recovery period
        ends. Once the scheduled deadline has passed, recovery is rejected. The
        email address and password are required, and the route is rate limited
        like sign-in. Reactivation never creates a session: the account
        must sign in again. An account that had not verified its email address
        returns to `PENDING_VERIFICATION` and a new verification email is sent.
        Reactivation never creates a session and never restores revoked
        sessions. The user must sign in again. Permanently deleted and suspended
        accounts cannot be recovered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The account was reactivated. No session is created.
          headers:
            Set-Cookie:
              description: Stale `nexus_rt` and `nexus_csrf` cookies are cleared.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The email address or password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account is suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The account is active, the recovery period has expired, or the account cannot be reactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many reactivation attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate the session
      security: []
      description: |
        The refresh token is read from the `nexus_rt` cookie or from the
        request body. A cookie authenticated request must also send the
        `x-csrf-token` header.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new access token and refresh token were issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '401':
          description: The refresh token is invalid, expired or was already rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The CSRF token is missing or does not match the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: End the current session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: The session was revoked.
  /auth/logout-all:
    post:
      tags: [Authentication]
      operationId: logoutAll
      summary: End every session of the account
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Every session was revoked.
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/sessions:
    get:
      tags: [Authentication]
      operationId: listSessions
      summary: List the active sessions of the account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The active sessions.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required: [sessions]
                    properties:
                      sessions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Session'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: The signed-in account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The signed-in account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password/forgot:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Request a password reset code
      security: []
      description: The response is identical whether or not the address is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: The request was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '429':
          description: Too many password requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password/reset:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Set a new password with a six-digit reset code
      security: []
      description: Every existing session of the account is revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: The password was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: The token is invalid, expired or has already been used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password/change:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change the password of the signed-in account
      description: Every other session of the account is revoked.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: The password was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: The current password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/email/change:
    post:
      tags: [Authentication]
      operationId: requestEmailChange
      summary: Request an email address change
      description: A confirmation link is sent to the new address. The address only changes once it is confirmed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
      responses:
        '200':
          description: The confirmation link was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: The current password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The new address is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/email/change/confirm:
    post:
      tags: [Authentication]
      operationId: confirmEmailChange
      summary: Confirm an email address change
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: The address was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: The token is invalid, expired or has already been used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/deactivate:
    post:
      tags: [Authentication]
      operationId: deactivateAccount
      summary: Deactivate the signed-in account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentPasswordRequest'
      responses:
        '204':
          description: The account was deactivated and every session was revoked.
        '401':
          description: The current password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/delete:
    post:
      tags: [Authentication]
      operationId: deleteAccount
      summary: Schedule deletion of the signed-in account
      description: |
        Requires the current password and exact account email confirmation.
        The account enters `PENDING_DELETION`, sessions and authentication
        tokens are revoked immediately, and final deletion is scheduled exactly
        30 days later. The user can recover through `/auth/reactivate` before
        the deadline and then establish a new session. Owned workspaces and
        shared content are retained; workspaces without an accepted transfer
        are suspended. Subscription cancellation is scheduled for the deadline.
        Billing responsibility requires separate explicit acceptance, and
        outstanding invoices remain payable. Financial retention periods need
        legal/accounting review.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeleteRequest'
      responses:
        '202':
          description: Deletion began and the current session was signed out. Cleanup runs asynchronously; the timestamp is the processing eligibility time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionScheduledResponse'
        '400':
          description: The confirmation does not match the email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The current password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account is suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The account could not be scheduled because an account or workspace lifecycle constraint failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many account deletion requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/me:
    get:
      tags: [Users]
      operationId: getProfile
      summary: The profile of the signed-in account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account has not verified its email address yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Users]
      operationId: updateProfile
      summary: Update the profile of the signed-in account
      description: The email address, account status and avatar URL cannot be changed here. Use the server-managed avatar routes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account has not verified its email address yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/me/avatar:
    get:
      tags: [Users]
      operationId: getMyAvatar
      summary: Read the signed-in account's private profile image
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The re-encoded JPEG, PNG, or WebP image.
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { description: Authentication is required. }
        '404': { description: The signed-in account has no uploaded avatar. }
    post:
      tags: [Users]
      operationId: uploadMyAvatar
      summary: Upload a private profile image
      description: Upload one multipart `avatar` file. Type is detected from file bytes; MIME headers and filename are ignored. Defaults are 5 MiB, 4096 pixels per side, and 16 million pixels total. The image is re-encoded and metadata is stripped. Five upload/delete requests are allowed per user and IP per configured authentication rate-limit window.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        '200':
          description: The updated profile; `avatarUrl` points to the authenticated avatar route.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '400': { description: Missing file or invalid multipart request. }
        '401': { description: Authentication is required. }
        '413': { description: Upload exceeds the byte, dimension, or pixel limit. }
        '415': { description: Unsupported or corrupt image. }
        '429': { description: Avatar upload rate limit reached. }
        '503': { description: Private object storage is not configured. }
    delete:
      tags: [Users]
      operationId: deleteMyAvatar
      summary: Remove the signed-in account's profile image
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Updated profile with no avatar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '401': { description: Authentication is required. }
        '429': { description: Avatar upload/delete rate limit reached. }
  /webhooks/email:
    post:
      tags: [Webhooks]
      operationId: receiveEmailWebhook
      summary: Provider delivery, bounce and complaint events
      security: []
      description: |
        Public endpoint called by the email provider. The request is
        authenticated by an HMAC signature over the raw request body, not by a
        session.

        The signature is read from the header named by
        `EMAIL_WEBHOOK_SIGNATURE_HEADER` (`x-nexus-signature` by default) and
        must be one of:

        - `sha256=<hex digest>` — the HMAC-SHA256 of the raw body.
        - `t=<unix seconds>,v1=<hex digest>` — the HMAC-SHA256 of
          `<unix seconds>.<raw body>`. The timestamp must be inside
          `EMAIL_WEBHOOK_TOLERANCE_SECONDS`.

        The endpoint answers `200` for every verified payload, including
        payloads that carry an unknown event, so the provider does not retry a
        message that will never be understood. Repeated events are applied
        once. A bounced or complained address is added to the suppression
        list and stops receiving mail.

        Brevo does not sign its events. The `/webhooks/email/{token}` route
        accepts the same payload and authenticates it with the shared token
        of the URL.
      parameters:
        - name: x-nexus-signature
          in: header
          required: false
          description: HMAC-SHA256 signature of the raw payload.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              delivered:
                summary: A provider delivery report
                value:
                  type: delivered
                  data:
                    email_id: 01J8Z0Q9W4
                  created_at: 2026-10-21T12:00:00.000Z
              bounced:
                summary: A provider bounce report
                value:
                  type: bounced
                  data:
                    email_id: 01J8Z0Q9W4
                    bounce:
                      type: permanent
                  created_at: 2026-10-21T12:05:00.000Z
      responses:
        '200':
          description: The payload was received and verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailWebhookResponse'
        '400':
          description: The payload is empty or cannot be processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The signature is missing or not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The deployment has no webhook secret configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webhooks/email/{token}:
    post:
      tags: [Webhooks]
      operationId: receiveEmailWebhookWithToken
      summary: Provider events authenticated with the token of the URL
      security: []
      description: |
        The same endpoint for providers that do not sign their events, Brevo
        among them. The token is the shared secret of the URL and is compared
        in constant time.
      parameters:
        - name: token
          in: path
          required: true
          description: The shared token of the webhook URL.
          schema:
            type: string
            minLength: 32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              brevoDelivered:
                summary: A Brevo delivery report
                value:
                  event: delivered
                  email: someone@example.com
                  message_id: <delivery-id@example.com>
                  ts: 1790000000
      responses:
        '200':
          description: The payload was received and verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailWebhookResponse'
        '400':
          description: The payload is empty or cannot be processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The token is missing or not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The deployment has no webhook secret configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webhooks/paystack:
    post:
      tags: [Webhooks, Billing]
      operationId: receivePaystackWebhook
      summary: Receive a signed Paystack event
      security: []
      description: |
        The endpoint verifies Paystack's timestamped `Paystack-Signature` as
        HMAC-SHA512 over the timestamp and exact raw request body using a
        server-only webhook signing secret. During header migration it also
        accepts the legacy `x-paystack-signature` when the new header is absent.
        Repeated payloads are deduplicated by their SHA-256 event key.
      parameters:
        - name: Paystack-Signature
          in: header
          required: true
          description: Timestamped Paystack webhook signature.
          schema:
            type: string
        - name: x-paystack-signature
          in: header
          required: false
          description: Legacy migration fallback; do not configure for new integrations.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaystackWebhookRequest'
      responses:
        '200':
          description: The event was accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaystackWebhookResponse'
        '400':
          description: The body is empty or contains invalid JSON or event data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The signature is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces:
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create a workspace
      description: The creator becomes the owner of the workspace.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
