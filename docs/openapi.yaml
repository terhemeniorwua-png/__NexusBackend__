      summary: Associate a project with a same-workspace team and department
      description: This Phase 7 relationship operation does not expose project CRUD. Department-bound teams require the project to use the same department. Team and department memberships are checked dynamically by the authorization policy.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectOrganizationAccessRequest'
      responses:
        '200':
          description: Project organizational relationships updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOrganizationAccessResponse'
        '403':
          {
            description: Project or organizational manager access required,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } },
          }
        '404':
          description: 'Project, team, or department is not available in this workspace.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          {
            description: Team and project department relationships are inconsistent,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } },
          }

