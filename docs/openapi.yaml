            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /privacy-requests/{requestId}/decision:
    post:
      tags: [Users]
      operationId: decidePrivacyRequest
      summary: Approve or reject a privacy request
      security:
        - bearerAuth: []
      parameters:
