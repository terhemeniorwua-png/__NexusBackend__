name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_test_pw
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-test-secret-ci-test-secret-ci-test-secret
      INTEGRATION_ENCRYPTION_KEY: 'hJqEqhQDlPeMmIOUcOoi4L08f8cUCPvM1jG-lEAsjbU'
      DATABASE_URL: postgresql://nexus:nexus_test_pw@localhost:5432/nexus_test?connection_limit=10&pool_timeout=30
      TEST_DATABASE_URL: postgresql://nexus:nexus_test_pw@localhost:5432/nexus_test?connection_limit=10&pool_timeout=30
      REDIS_URL: redis://localhost:6379
      RUN_PHASE3_DB_TESTS: "true"
      RUN_PHASE4_DB_TESTS: "true"
      RUN_PHASE5_DB_TESTS: "true"
      RUN_PHASE6_DB_TESTS: "true"
      RUN_PHASE7_DB_TESTS: "true"
      RUN_PHASE8_DB_TESTS: "true"
      RUN_PHASE9_DB_TESTS: "true"
      RUN_PHASE10_DB_TESTS: "true"
      RUN_BILLING_DB_TESTS: "true"
      RUN_PHASE19_DB_TESTS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (fails if lockfile is out of sync)
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  db-tests:
    name: CI/db-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_test_pw
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-test-secret-ci-test-secret-ci-test-secret
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci-refresh-secret
      INTEGRATION_ENCRYPTION_KEY: 'hJqEqhQDlPeMmIOUcOoi4L08f8cUCPvM1jG-lEAsjbU'
      DATABASE_URL: postgresql://nexus:nexus_test_pw@localhost:5432/nexus_test?connection_limit=10&pool_timeout=30
      TEST_DATABASE_URL: postgresql://nexus:nexus_test_pw@localhost:5432/nexus_test?connection_limit=10&pool_timeout=30
      REDIS_URL: redis://localhost:6379
      RUN_BE2_DB_TESTS: "true"
      RUN_BE3_DB_TESTS: "true"
      RUN_BE4_DB_TESTS: "true"
      RUN_BE5_DB_TESTS: "true"
      RUN_BE5B_DB_TESTS: "true"
      RUN_BE6_DB_TESTS: "true"
      RUN_BE7_DB_TESTS: "true"
      RUN_BE8_DB_TESTS: "true"
      RUN_BE9_DB_TESTS: "true"
      RUN_BE10A_DEV_ACTIVITY_DB_TESTS: "true"
      RUN_BILLING_DB_TESTS: "true"
      RUN_PHASE2_DB_TESTS: "true"
      RUN_PHASE3_DB_TESTS: "true"
      RUN_PHASE3_TASK_WORKSPACE_DB_TESTS: "true"
      RUN_PHASE4_DB_TESTS: "true"
      RUN_PHASE4_TASK_BLOCKERS_DB_TESTS: "true"
      RUN_PHASE4_TASK_SUBTASK_WEIGHTS_DB_TESTS: "true"
      RUN_PHASE4_TASK_TIME_ENTRIES_DB_TESTS: "true"
      RUN_PHASE4_TASK_WORK_DOCUMENTS_DB_TESTS: "true"
      RUN_PHASE5_DB_TESTS: "true"
      RUN_PHASE6_DB_TESTS: "true"
      RUN_PHASE7_DB_TESTS: "true"
      RUN_PHASE8_DB_TESTS: "true"
      RUN_PHASE9_DB_TESTS: "true"
      RUN_PHASE10_DB_TESTS: "true"
      RUN_PHASE18_DB_TESTS: "true"
      RUN_PHASE19_DB_TESTS: "true"
      RUN_PHASE20_DB_TESTS: "true"
      RUN_PHASE21_DB_TESTS: "true"
      RUN_PHASE25_DB_TESTS: "true"
      RUN_PHASE26_DB_TESTS: "true"
      RUN_PHASE27_DB_TESTS: "true"
      RUN_PHASE30_DB_TESTS: "true"
      RUN_PROJECT_TYPE_DB_TESTS: "true"
      RUN_S1_SPRINTS_DB_TESTS: "true"
      RUN_S2_SPRINTS_DB_TESTS: "true"
      RUN_S3_SPRINTS_DB_TESTS: "true"
      RUN_SSO_DB_TESTS: "true"
      RUN_TASK_ACCEPT_REVIEWER_DB_TESTS: "true"
      RUN_TASK_ASSIGNEE_ELIGIBILITY_DB_TESTS: "true"
      RUN_TASK_DATE_OVERDUE_FILTERS_DB_TESTS: "true"
      RUN_TASK_DEADLINE_NOTIFICATION_DB_TESTS: "true"
      RUN_TASK_DEPENDENCY_GATE_DB_TESTS: "true"
      RUN_TASK_RECURRENCE_WORKER_DB_TESTS: "true"
      RUN_TASKS_ADVANCED_DB_TESTS: "true"
      RUN_TASK_STATUS_TRANSITION_DB_TESTS: "true"
      RUN_TASK_SUBTASK_INTEGRITY_DB_TESTS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (fails if lockfile is out of sync)
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run DB-gated test files (fresh DB per file)
        env:
          PGPASSWORD: nexus_test_pw
        run: |
          set +e
          echo "file,exit_code,tests,pass,fail" > /tmp/db_results.csv
          # No excluded DB-gated tests.
          FILES="tests/NEWFILE tests/auth-phase3.test.ts tests/avatar-upload.test.ts tests/be2-reviews-db.test.ts tests/be3-attachment-versions-db.test.ts tests/be4-checklists-db.test.ts tests/be5b-github-notifications-db.test.ts tests/be5-notifications-db.test.ts tests/be6-github-sync-db.test.ts tests/be8-progress-updates-db.test.ts tests/be9-repo-access-db.test.ts tests/be9-repo-access-enforcement-db.test.ts tests/be9-repo-access-member-api-db.test.ts tests/be10a-dev-activity-ingest-db.test.ts tests/billing-seat-sync-db.test.ts tests/calendar-project-access.test.ts tests/collaboration-email-phase4-db.test.ts tests/database-phase2.test.ts tests/email-phase4-db.test.ts tests/google-oauth-db.test.ts tests/integrations-imports-feat.test.ts tests/meeting-email-phase4-db.test.ts tests/meeting-project-access.test.ts tests/mention-email-phase4-db.test.ts tests/overview-project-docs-db.test.ts tests/phase10-messaging-db.test.ts tests/phase18-search-db.test.ts tests/phase19-integrations-db.test.ts tests/phase19-routes.test.ts tests/phase19-webhooks-db.test.ts tests/phase20-automation-db.test.ts tests/phase21-ai-db.test.ts tests/phase25-email-db.test.ts tests/phase26-audit-db.test.ts tests/phase27-analytics-db.test.ts tests/phase30-performance.test.ts tests/phase3-task-workspace-db.test.ts tests/phase4-task-blockers-db.test.ts tests/phase4-task-subtask-weights-db.test.ts tests/phase4-task-time-entries-db.test.ts tests/phase4-task-work-documents-db.test.ts tests/phase5-join-requests-db.test.ts tests/phase5-task-reassignment-db.test.ts tests/phase5-workspaces-db.test.ts tests/phase6-authorization-db.test.ts tests/phase7-teams-db.test.ts tests/phase8-projects-db.test.ts tests/phase9-tasks-db.test.ts tests/project-type-db.test.ts tests/search-project-visibility.test.ts tests/slack-default-connect.test.ts tests/slack-oauth-security.test.ts tests/sprints-stage1-db.test.ts tests/sprints-stage2-db.test.ts tests/sprints-stage3-db.test.ts tests/sso-enforcement-db.test.ts tests/task-accept-reviewer-db.test.ts tests/task-assignee-eligibility-db.test.ts tests/task-assignment-phase4-db.test.ts tests/task-clarification-db.test.ts tests/task-date-overdue-filters-db.test.ts tests/task-deadline-notification-worker-db.test.ts tests/task-dependency-gate-db.test.ts tests/task-recurrence-worker-db.test.ts tests/tasks-advanced-saved-views-db.test.ts tests/task-status-transition-db.test.ts tests/task-subtask-integrity-db.test.ts"
          for f in $FILES; do
            safe=$(echo "$f" | sed 's#[/.]#_#g')
            dbname="nxc_${safe}_$(date +%s%N | tail -c 6)"
            echo "--- Running $f (db: $dbname) ---"
            psql -h localhost -U nexus -d postgres -c "CREATE DATABASE \"$dbname\";"
            if [ $? -ne 0 ]; then
              echo "$f,CREATE_DB_FAILED,0,0,0" >> /tmp/db_results.csv
              continue
            fi
            export DATABASE_URL="postgresql://nexus:nexus_test_pw@localhost:5432/$dbname?connection_limit=10&pool_timeout=30"
            export TEST_DATABASE_URL="$DATABASE_URL"
            npx prisma migrate deploy
            if [ $? -ne 0 ]; then
              echo "$f,MIGRATE_FAILED,0,0,0" >> /tmp/db_results.csv
              psql -h localhost -U nexus -d postgres -c "DROP DATABASE IF EXISTS \"$dbname\" WITH (FORCE);" || true
              continue
            fi
            npx tsx --test --test-concurrency=1 "$f" 2>&1 | tee /tmp/last_test.log
            code=${PIPESTATUS[0]}
            tests=$(grep -E '^# tests ' /tmp/last_test.log | tail -1 | awk '{print $3}')
            pass=$(grep -E '^# pass ' /tmp/last_test.log | tail -1 | awk '{print $3}')
            fail=$(grep -E '^# fail ' /tmp/last_test.log | tail -1 | awk '{print $3}')
            echo "$f,$code,${tests:-0},${pass:-0},${fail:-0}" >> /tmp/db_results.csv
            psql -h localhost -U nexus -d postgres -c "DROP DATABASE IF EXISTS \"$dbname\" WITH (FORCE);" || true
          done
          echo ""
          echo "===== DB-GATED TESTS EXIT-CODE TABLE ====="
          cat /tmp/db_results.csv
          echo "=========================================="
          awk -F, 'NR>1 {ec=$2; tests=$3+0; fail=$5+0; if (ec != "0" || fail > 0 || tests == 0) bad=1} END{exit bad?1:0}' /tmp/db_results.csv
