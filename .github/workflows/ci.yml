name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_test_pw
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nexus:nexus_test_pw@localhost:5432/nexus_test
      TEST_DATABASE_URL: postgresql://nexus:nexus_test_pw@localhost:5432/nexus_test
      RUN_PHASE3_DB_TESTS: "true"
      RUN_PHASE4_DB_TESTS: "true"
      RUN_PHASE5_DB_TESTS: "true"
      RUN_PHASE6_DB_TESTS: "true"
      RUN_PHASE7_DB_TESTS: "true"
      RUN_PHASE8_DB_TESTS: "true"
      RUN_PHASE9_DB_TESTS: "true"
      RUN_PHASE10_DB_TESTS: "true"
      RUN_BILLING_DB_TESTS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (fails if lockfile is out of sync)
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
